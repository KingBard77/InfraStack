schema_version: '1.0'
package_id: architecture-ubiquiti-unifi
introduction: >-
  Build editable Ubiquiti UniFi network, campus wireless, and video-security architectures from provider-specific device templates. Maintain one normalized Studio inventory and review modeled addressing, isolation, resilience, monitoring, backup, and relationship facts.
faq:
  - question: Are these UniFi architecture templates editable?
    answer: Yes. Every template is normalized Studio JSON, so devices, labels, properties, positions, views, and relationships remain editable.
  - question: Do these templates configure or deploy UniFi devices?
    answer: No. They are architecture models and do not adopt devices, change a UniFi Console, configure VLANs, or validate a live network.
  - question: Why are some products represented by legacy UniFi model names?
    answer: The supplied SVG library contains historical UniFi access points, switches, gateways, video devices, and VoIP phones. Confirm current availability and support directly with Ubiquiti before procurement or deployment.
  - question: What does the Studio Result evaluate?
    answer: It evaluates only the network, security, availability, operations, backup, and documentation facts modeled in the current Studio project.
  - question: Does a high Studio grade certify the UniFi design?
    answer: No. The grade is deterministic planning guidance and does not replace wireless surveys, capacity planning, security review, procurement validation, or production testing.
