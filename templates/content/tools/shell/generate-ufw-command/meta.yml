intro: >-
    Collect UFW firewall rule intent, source and destination selectors, action, direction, protocol, ports, route posture, comments, dry-run options, and application profile mode in a browser-owned workspace.
    Preview command text, option rows, warning rows, sortable operation details, and JSON restore data without running UFW, changing host policy, or claiming packet-flow validation.
    Use the generated output as a review artifact before copying it into a privileged terminal.
