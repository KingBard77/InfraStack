summary: Generate on-prem physical server architecture diagrams from a prompt, preset, editable controls, and restorable JSON state.
intro: >-
    Turn a physical server brief into an on-prem infrastructure workspace for racks, hypervisor nodes, storage, switching, and operations planning.
    Map users, gateway, firewall, core switching, compute cluster, virtualization, Synology or shared storage, segmented VLANs, monitoring, backup, and facility foundations.
    Refine live controls, adjust the stage, inspect inventory and review notes, then export the diagram state for handoff or comparison.
