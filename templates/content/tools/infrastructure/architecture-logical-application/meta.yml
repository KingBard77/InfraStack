summary: Generate logical application architecture diagrams from presets, custom fields, editable stage controls, and restorable JSON state.
intro: >-
    Turn a logical application brief into an editable workspace for actors, frontend channels, backend services, data stores, integrations, identity, notifications, observability, and business flow.
    Start from web, mobile, microservices, enterprise, government, AI/ML, event-driven, data pipeline, IAM, or dependency-map presets, then tune the custom fields directly.
    Inspect inventory, routing summaries, review notes, advisory model signals, and JSON state before exporting the diagram for application design handoff.
