family: shell
version: 1.1.0
status: active
description: Baseline template for InfraStack browser-first shell and command-generation tools, composed from shared `_base` workspace sections plus shell-owned generated command result text.
baseline_snapshot: "2026-05-18"
agent_map: templates/content/factory/phase-1/_family/shell/FAMILY.md

baseline_path: templates/content/factory/phase-1/_family/shell/
preferred_baseline_path: templates/content/factory/phase-1/_family/shell/
workspace_path: templates/content/factory/phase-1/_family/shell/workspace/
scaffold_path: templates/content/factory/phase-2/_content/scaffold/
content_sections_path: templates/content/factory/phase-2/_content/sections/

reference_tool:
    path: templates/content/tools/shell/generate-netcat-shell/
    purpose: Historical working reference for shell-family composition before promotion. Use the family source for reapplication; use this package only for implementation quality review or snapshot refresh.
    aliases:
        - Netcat Command Generator
        - netcat command generator
        - generate-netcat-shell
        - generate_netcat_shell

runtime_baseline:
    source_tool: templates/content/tools/shell/generate-netcat-shell/
    source_snapshot: templates/content/factory/phase-1/_family/shell/source/
    source_of_truth: templates/content/factory/phase-1/_family/shell/workspace/
    workspace_sections: composed from templates/content/factory/phase-1/_base/workspace/ and templates/content/factory/phase-1/_family/shell/workspace/
    model_core: templates/content/factory/phase-1/_family/shell/workspace/assets/bin/model-core.js
    copy_mode: base_plus_family_contract
    css_js_mode: base_plus_family_extracted
    root_runtime_snapshots: false
    source_marker_mode: baseline_snapshot_marker_anchored
    source_markers:
        syntax: "source:start/source:end family.shell.workspace.<section>"
        path: templates/content/factory/phase-1/_family/shell/source/
        files:
            - tool.html.twig
            - custom.css
            - custom.js
    extracted_runtime_sources:
        css:
            shared_foundation: repeated minimal section demo foundation only
            section_specific: workspace section.css owns the CSS needed by its section
            forbidden: full custom.css copies inside section folders
        js:
            source_ownership_maps: workspace section.js records section-specific custom.js line ranges, DOM IDs, classes, variables, functions, and behaviors
            forbidden: full custom.js runtime strings inside section folders
    model_core_sha256: 5c4e56b1f1585e9c6b26ebde6685f1dcedeb2be998a08d5fa06ab6520ced9427
    source_hashes:
        tool_html_twig: 0ba0786819606fc0f28708709454b74125201d33df41566dc051a4e53be9fb82
        custom_css: 1d75a1962974a92c60dbf5dc89ef4d5931ccec00c8d053d307188988982fe000
        custom_js: 0b2bc9ed0b725ae1eb8dd10dbb466a165ff6597ac08e2819ce736d2b787b7571
        model_core: 5c4e56b1f1585e9c6b26ebde6685f1dcedeb2be998a08d5fa06ab6520ced9427
    rule: Keep the full copied shell source under source/ as a reference-only snapshot. Do not audit this as active source. Use `_base/workspace` for common workspace shape and shell workspace only for generated command result text, optional command visual contract, and reusable command model helpers. Do not create root workspace/custom.css or workspace/custom.js snapshots.

runtime_parity:
    default_profile: command_generator
    profiles:
        command_generator:
            reference_tool: templates/content/tools/shell/generate-chmod-shell/
            css_reference_mode: production_reference
            min_css_reference_coverage: 0.90
            min_css_section_coverage: 0.90
            base_contract_sections:
                - family._base.workspace.00_shell
                - family._base.workspace.01_input-brief
                - family._base.workspace.02_basic-settings
                - family._base.workspace.03_custom-settings
                - family._base.workspace.05_result-summary
                - family._base.workspace.06_output-toolbar
                - family._base.workspace.07_table-output
                - family._base.workspace.08_json-restore
            family_sections:
                - family.shell.workspace.04_result-text
                - family.shell.workspace.04_visual-contract
            required_behaviors:
                - hidden_first
                - primary_action_generates_output
                - custom_dropdown_state_sync
                - sort_state_sync
                - tab_state_sync
                - json_export_restore
            required_tabs:
                - Operations
                - Command
                - Details
                - Warnings
                - JSON
            required_actions:
                - Export PDF
                - Download CSV
                - Copy JSON
                - Download JSON
                - Import JSON
            allowed_differences:
                - tool_title
                - domain_labels
                - input_placeholder
                - command_domain
                - option_labels
                - generated_command_text

applies_to:
    - command generators
    - shell builders
    - one-liner builders
    - CLI option composers
    - command validators
    - command explainers
    - runbook command helpers
    - terminal workflow helpers

preferred_verbs:
    - generate
    - compose
    - explain
    - validate

required_sections:
    content:
        - 01_overview
        - 02_technical-details
        - 04_tips-prompts
        - 05_how-to-use
        - 06_export-notes
        - 07_faq
        - 09_example-commands
        - 10_references
    workspace:
        - _base.00_shell
        - _base.01_input-brief
        - _base.02_basic-settings
        - _base.03_custom-settings
        - 04_visual-contract
        - 04_result-text
        - _base.05_result-summary
        - _base.06_output-toolbar
        - _base.07_table-output
        - _base.08_json-restore

workspace_section_file_contract:
    required_per_section:
        - README.md
        - demo.html
        - page.html.twig
        - section.css
        - section.js
    role: Match the architecture family section bundle shape so each shell workspace section has documentation, isolated demo markup, reusable Twig, scoped CSS, and scoped JavaScript.
    visual_contract_additional_files:
        - manifest.yml
        - model-core.js

required_output_files:
    - card.yml
    - content.md
    - custom.css
    - custom.js
    - meta.yml
    - tool.html.twig

recommended_output_files:
    - assets/bin/model-core.js
    - assets/icon/
    - assets/img/post.html.twig

required_first_line_markers:
    content.md: "[//]: # (content.md)"
    card.yml: "# card.yml"
    custom.css: "/* custom.css */"
    custom.js: "// custom.js"
    meta.yml: "# meta.yml"
    tool.html.twig: "{# tool.html.twig #}"

workspace_flow:
    - base_shell
    - input_brief
    - basic_settings
    - custom_settings
    - visual_contract_when_needed
    - result_text
    - result_summary
    - output_toolbar
    - table_output
    - json_restore

baseline_standard:
    generated_command:
        copy_action: required
        execute_in_browser: forbidden
        token_order: cli_native
    output:
        sort_default: id
        row_copy: icon_only
        before_after_demo_layout: vertical_stack
        tabs:
            - Command
            - Operations
            - Warnings
            - JSON
        table_columns:
            - "#"
            - Field
            - Value
            - Action
        empty_state: direct_tool_empty_state_notice
        import_json: show_only_when_restore_is_implemented
    support_content:
        example_section_label: Example Commands
        example_section_source: 09_example-commands
        example_terminal_title: centered_title_case
        tips_section_label: command_or_input_tips
        references_section: 10_references_for_complete_factual_content_and_source_backed_citations

export_priority:
    - copy_command
    - PDF_or_print_report
    - CSV
    - JSON
    - Import_JSON_restore_when_implemented

generation_rules:
    - Use this family template as the baseline for shell tools.
    - Use generate, compose, explain, or validate as the first canonical token for new shell tool identities.
    - Generate the final runtime package under templates/content/tools/<category>/<tool-slug>/.
    - Do not use the family directory as the final runtime package.
    - Do not omit tool-local files because the family source exists.
    - Keep full copied shell source under source/ as a reference-only snapshot when refreshing this baseline. Do not audit this as active source.
    - Compose final tools from the shell workspace `workspace_namespaces` list.
    - Use `_base/workspace` for common shell, input, settings, summary, toolbar, table, and JSON restore shape.
    - Keep shell-owned reusable behavior in 04_result-text, optional 04_visual-contract, workspace/assets/bin/model-core.js, and final tool model logic.
    - Use workspace/04_visual-contract for shell tools that need reusable command visual state beyond plain inputs and generated command text.
    - Omit 04_visual-contract for pure form-and-command-output tools only when the omission is recorded as accepted divergence.
    - Keep generated command source of truth in 04_result-text or final tool model logic; do not make 04_visual-contract the command generator.
    - Preserve generated command result-text behavior when `_base` result summary does not cover command preview, command copy, or empty command output behavior.
    - Reapplying this family to existing shell runtime packages requires structural, visual, and runtime parity with the composed `_base` and shell-owned family workspace source, not marker coverage.
    - Preserve only command-native labels, operands, option logic, warning rules, stable DOM IDs needed by existing behavior, and exported JSON schema compatibility.
    - Record every intentional divergence from the family source in the task record and closeout.
    - Keep shell-owned workspace sections scoped as 04_result-text and optional 04_visual-contract.
    - Keep result before and after states stacked as two rows in one column in affected family demos.
    - Keep shell-owned section.css extracted to the relevant custom.css selectors plus the repeated minimal demo foundation, matching the architecture family pattern.
    - Keep shell-owned section.js extracted to source ownership maps; do not embed the full custom.js runtime in section.js strings.
    - Keep workspace/assets/bin/model-core.js as the reusable model-core source when the source tool ships one.
    - Use the shell workspace source as the current working baseline for shell workspace grammar.
    - Do not copy netcat-specific flags or wording into unrelated shell tools.
    - Apply category/provider token lineage, restrained visual weight, and tool-specific namespace.
    - Keep CSS and JavaScript scoped to the final tool.
    - Keep command examples and support content domain-native.
    - Keep output toolbar controls boxed, compact, and grouped by sort versus actions.
    - Default sortable operation rows to ID when stable row order exists.
    - Show warnings for unsupported, dropped, or risky command options.
    - Show Import JSON only when restore rebuilds the normalized model and visible outputs.
    - Use phase-2 content sections from templates/content/factory/phase-2/_content/sections/.
    - Apply phase-2 content sections as a full contract: content.md markup, section.css visual behavior, and section.js helper behavior when present.
    - Final tool custom.css and custom.js must preserve the applied section card frame, section title icon, heading divider, Technical Details subsection separator, row icon, typography, table, list, details, FAQ, copy, citation, prompt, or command behavior unless a documented shared include exists.
    - Shell support section headings use a left icon and divider line.
    - Command Tips, How To Use, and FAQ accordion rows use compact left icon chips.
    - How To Use and FAQ include a short explanatory paragraph before the first accordion row.
    - Use 10_references for complete factual content delivery and when final content includes valid source-backed citations, with in-text citation links targeting matching References row IDs.
    - Do not create a family-local sections/ directory.

validation_rules:
    - README.md exists.
    - manifest.yml exists.
    - workspace/README.md exists.
    - workspace/manifest.yml exists.
    - Shell workspace manifest declares `workspace_namespaces`.
    - Shell-owned workspace section folders exist under templates/content/factory/phase-1/_family/shell/workspace/.
    - Each shell-owned workspace section folder contains README.md, demo.html, page.html.twig, section.css, and section.js.
    - workspace/04_visual-contract contains manifest.yml and model-core.js.
    - source/tool.html.twig, source/custom.css, source/custom.js, and source/assets/bin/model-core.js exist.
    - root workspace/custom.css and workspace/custom.js do not exist.
    - workspace/assets/bin/model-core.js exists and matches the declared reusable model-core hash.
    - Shared phase-2 content section source exists under templates/content/factory/phase-2/_content/sections/.
    - Applied shared content sections are validated in the final tool package for namespace markers, unresolved placeholders, required custom.css selectors, and helper hooks when used.
    - Applied shell workspace sections are validated in the final tool package for structural, visual, and runtime parity with the composed family source; namespace markers alone are insufficient.
    - Citation links and References rows are paired when 10_references is used.
    - No duplicated shell sections/ directory exists under templates/content/factory/phase-1/_family/shell/.
    - Required final output files are created in the final tool package.
    - Required first-line markers are present.
    - Tool namespace is unique.
    - CSS is scoped under the tool root.
    - JavaScript DOM references match Twig IDs.
    - Generated command, tables, exports, warnings, errors, and JSON use one normalized model.
    - Export controls match implemented behavior.
    - Import controls appear only when JSON restore is implemented and validated.
    - Content does not claim command safety, compliance, security, or production readiness unless validated.
