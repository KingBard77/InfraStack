applies_to:
    - cost calculators
    - pricing estimators
    - capacity calculators
    - sizing calculators
    - storage calculators
    - network calculators
    - budget calculators
    - run-rate estimators
    - service mix estimators
    - assumption-driven planning tools

section_adaptation:
    content:
        01_overview: calculator overview and estimate boundary
        02_technical-details: normalized inputs, assumptions, rates, and formulas
        03_example-prompts: preset-aligned example prompts or estimate briefs with Copy prompt controls
        example_terminal_title: centered title case
        04_tips-prompts: input tips and assumption guidance
        05_how-to-use: estimate workflow
        06_export-notes: PDF, CSV, JSON, copy, and import restore boundaries
        07_faq: calculator trust boundaries
        08_acronyms: optional abbreviation expansion table; domain and pricing acronyms
        11_glossary: optional broader terminology table; broader domain, command, workflow, platform, or estimate terminology
        10_references: complete factual content delivery, valid source-backed citations, and References rows when final calculate content cites sources
    workspace:
        _base.00_shell: shared workspace frame, panel rhythm, and responsive shell
        _base.01_input-brief: shared estimate label, scenario, or brief input frame
        _base.02_basic-settings: shared preset and required setting frame
        _base.03_custom-settings: shared optional Custom settings panel frame
        04_visual-contract: optional calculate visual and model contract for metric cards, driver cards, formula rows, rings, charts, and visual result primitives
        04_selected-item: optional selected line item or component inspector; no-op unless a calculator supports selection
        _base.05_result-summary: shared two-column result overview, primary answer card, metrics, chips, and top-driver frame
        _base.06_output-toolbar: shared sort, export, copy, and optional import toolbar frame
        _base.07_table-output: shared tabbed table, assumptions, recommendations, and JSON output shell
        _base.08_json-restore: shared calculator JSON payload output and restore frame

workspace_section_file_contract:
    required_per_section:
        - README.md
        - demo.html
        - page.html.twig
        - section.css
        - section.js
    role: Calculate-owned sections match the architecture family bundle shape. Common sections are sourced from `_base/workspace`.
    visual_contract_additional_files:
        - manifest.yml
        - model-core.js

required_output_files:
    - card.yml
    - content.md
    - custom.css
    - custom.js
    - meta.yml
    - tool.html.twig

optional_output_files:
    - assets/bin/model-core.js
    - assets/icon/
    - assets/img/post.html.twig

required_first_line_markers:
    content.md: "[//]: # (content.md)"
    card.yml: "# card.yml"
    custom.css: "/* custom.css */"
    custom.js: "// custom.js"
    meta.yml: "# meta.yml"
    tool.html.twig: "{# tool.html.twig #}"

workspace_flow:
    - estimate_label_or_scenario
    - preset_or_basic_settings
    - service_or_component_cards
    - advanced_assumptions_rates_overrides
    - visual_contract_when_needed
    - result_summary
    - output_toolbar_sort_copy_export_import
    - result_tabs_table_shell
    - json_payload_output_restore

source_namespaces:
    - family.calculate.workspace.04_visual-contract
    - family.calculate.workspace.04_selected-item
    - family._base.workspace.00_shell
    - family._base.workspace.01_input-brief
    - family._base.workspace.02_basic-settings
    - family._base.workspace.03_custom-settings
    - family._base.workspace.05_result-summary
    - family._base.workspace.06_output-toolbar
    - family._base.workspace.07_table-output
    - family._base.workspace.08_json-restore

export_priority:
    - PDF_or_print_report
    - CSV
    - JSON
    - Import_JSON_restore_when_implemented

generation_rules:
    - Use this family template as the baseline for calculate tools.
    - Use calculate as the family verb for new calculate tool identities.
    - Use calculate-prefixed names for calculate family outputs.
    - Generate the final runtime package under templates/content/tools/<category>/<tool-slug>/.
    - Do not use the family directory as the final runtime package.
    - Do not omit tool-local files because the family source exists.
    - Keep the full copied calculate source under source/calculate-cost-aws/ as the approved production package snapshot.
    - Audit the source snapshot for freshness against templates/content/tools/aws/calculate-cost-aws/ before using it as a seed; do not import it directly as active workspace section source.
    - Use AWS Cost Calculator as the structural reference and Azure plus IBM Cloud as provider-adaptation references.
    - Compose calculate runtime output from `source_namespaces`, using `_base/workspace` for common shell, input, settings, summary, toolbar, table, and JSON restore sections.
    - Mirror the stabilized calculate output shell by adapting `_base` result summary, toolbar shell, tabs shell, table shell, and JSON panel.
    - Start sortable line-item output on ID when stable row order exists.
    - Keep output action buttons compact and boxed, not oversized pills.
    - Use Example Prompts with Copy prompt controls for preset-aligned estimate briefs.
    - Use Example Inputs only for calculators with no prompt, brief, or preset-copy workflow.
    - Keep support markdown tables aligned with fixed layout, wrapping, and no forced content-column overflow.
    - Do not copy provider-specific language, service names, pricing assumptions, category/provider tokens, or chart colors into unrelated calculators.
    - Apply category/provider token lineage, restrained visual weight, and tool-specific namespace.
    - Keep CSS and JavaScript scoped to the final tool.
    - Keep content domain-native and aligned with actual behavior.
    - Use the tokenized family source package from templates/content/factory/phase-1/_family/calculate/source/calculate-cost-aws/.
    - Keep calculate-owned source behavior aligned to the tokenized source package namespace markers.
    - Use the source package 04_visual-contract namespace for calculate tools that need a reusable model or visual result contract beyond plain inputs and table output.
    - Omit 04_visual-contract for pure form-and-table calculators only when the omission is recorded as accepted divergence.
    - Keep selected item, details panel, and runtime editing behavior out of 04_visual-contract unless a dedicated inspector section is deliberately added.
    - When the user says to baseline a calculate tool, refresh the approved source package only after explicit approval.
    - Use shared content section source from templates/content/factory/phase-2/_content/sections/.
    - Apply phase-2 content sections as a full contract: content.md markup, section.css visual behavior, and section.js helper behavior when present.
    - Final tool custom.css and custom.js must preserve the applied section card frame, heading divider, typography, table, list, details, FAQ, copy, citation, prompt, or command behavior unless a documented shared include exists.
    - Use 10_references for complete factual content delivery and when final content includes valid source-backed citations, with in-text citation links targeting matching References row IDs.
    - Do not create a family-local sections/ directory.

validation_rules:
    - README.md exists.
    - manifest.yml exists.
    - source package folder exists.
    - source demo.html exists.
    - Shared phase-2 content section source exists under templates/content/factory/phase-2/_content/sections/.
    - Applied shared content sections are validated in the final tool package for namespace markers, unresolved placeholders, required custom.css selectors, and helper hooks when used.
    - Citation links and References rows are paired when 10_references is used.
    - source/ contains only source/calculate-cost-aws/.
    - source/calculate-cost-aws/card.yml, content.md, custom.css, custom.js, demo.html, meta.yml, tool.html.twig, assets/bin/, assets/icon/, and assets/img/post.html.twig exist.
    - source/calculate-cost-aws/ matches templates/content/tools/aws/calculate-cost-aws/ file-for-file, except local Finder artifacts.
    - Calculate root family manifest declares `source_namespaces`.
    - Calculate source namespace markers exist inside the source package runtime files.
    - Calculate-owned source namespace markers exist inside the source package runtime files.
    - source package assets/bin/model-core.js exists when the reference tool ships one.
    - root-level loose source/custom.css, source/custom.js, and source/tool.html.twig do not exist.
    - Declared reference tool paths exist.
    - Reusable workspace section examples are provider-neutral unless a section explicitly documents a provider-specific example.
    - No duplicated calculate sections/ directory exists under templates/content/factory/phase-1/_family/calculate/.
    - Required final output files are created in the final tool package.
    - Required first-line markers are present.
    - Tool namespace is unique.
    - CSS is scoped under the tool root.
    - JavaScript DOM references match Twig IDs.
    - Calculations use a normalized model.
    - Export controls match implemented exports.
    - Import controls appear only when JSON restore is implemented and validated.
    - JSON output matches the current result payload.
    - Result summary, visible tables, tabs, exports, and JSON are generated from the same normalized model.
    - Example Prompt copy controls target the matching prompt block without duplicate generic copy buttons.
    - Support markdown tables do not clip Overview, service-driver, or review-boundary columns.
    - Content does not claim live pricing, billing accuracy, compliance, or production readiness unless validated.
    - Provider-adapted tools include a copied-token scan for provider names and category/provider lineage tokens.
