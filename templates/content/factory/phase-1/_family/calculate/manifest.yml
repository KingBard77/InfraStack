      css_sha256: e488d0c5dd5f7494e0b48cb4466c1d60fb12a513c94befe6106a519bf1c31528
      js_sha256: 1fe8b262e7df70550b2045ce6af9c78439d0e68bb2ac45bc979c72a433cd47ca
      aliases:
