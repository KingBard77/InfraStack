family: calculate
version: 1.6.0
status: active
description: Baseline template for InfraStack browser-first calculator tools composed from shared `_base` workspace structure plus calculate-owned visual contracts, inspector slots, normalized models, table export semantics, and JSON restore boundaries.
baseline_snapshot: "2026-06-04"
agent_map: templates/content/factory/phase-1/_family/calculate/FAMILY.md

baseline_path: templates/content/factory/phase-1/_family/calculate/
preferred_baseline_path: templates/content/factory/phase-1/_family/calculate/
source_path: templates/content/factory/phase-1/_family/calculate/source/calculate-cost-aws/
scaffold_path: templates/content/factory/phase-2/_content/scaffold/
content_sections_path: templates/content/factory/phase-2/_content/sections/

reference_tool:
    path: templates/content/tools/aws/calculate-cost-aws/
    purpose: Approved production reference for calculate-family composition. Use the workflow grammar and quality bar, not AWS-specific pricing copy.
    aliases:
        - AWS Cost Calculator
        - AWS cost calculator
        - aws-cost-calculator
        - calculate-cost-aws

section_runtime_baseline:
    source_tools:
        - path: templates/content/tools/aws/calculate-cost-aws/
          role: primary structural reference for workspace rhythm, output toolbar, result tabs, JSON restore, and support-content pattern
        - path: templates/content/tools/azure/calculate-cost-azure/
          role: provider-adaptation reference for Azure service names, category/provider tokens, chart palette replacement, and copied-token cleanup
        - path: templates/content/tools/ibm/calculate-cost-ibm/
          role: provider-adaptation reference for IBM Cloud service names, category/provider tokens, chart palette replacement, and copied-token cleanup
    source_snapshot: templates/content/factory/phase-1/_family/calculate/source/calculate-cost-aws/
    purpose: Section-owned files are the reusable baseline. The source snapshot is audited for production freshness but is not imported directly as active workspace section source. AWS supplies the structural reference while Azure and IBM Cloud prove provider adaptation, category/provider token handling, and copied-token cleanup.

runtime_baseline:
    source_tool: templates/content/tools/aws/calculate-cost-aws/
    source_snapshot: templates/content/factory/phase-1/_family/calculate/source/calculate-cost-aws/
    source_package: templates/content/factory/phase-1/_family/calculate/source/calculate-cost-aws/
    copy_mode: base_plus_family_contract
    source_hashes:
        tool_html_twig: 84974412729dab4b059aaf4d64daf00a3ca40fbfd51f614998a9d6a76d0dc0d4
        custom_css: 7d96a0d43219a426c09f1fe3a3a807f2765eb7f541e99b8bd61dcfbd3aca0905
        custom_js: 9453b9ce6fd5e198122d0a710e24a9a53082f9196bd1aaea2b30eeb9f4236fea
    rule: Keep the full copied calculate source under source/calculate-cost-aws/ as a reference-only full package snapshot. Audit it for freshness against production before using it as a seed. Do not keep loose root-level source/custom.css, source/custom.js, or source/tool.html.twig files. Keep stabilized runtime structure in namespace-marked source package runtime files.

