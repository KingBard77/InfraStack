source: assessment-family-workspace
family: assessment
version: 1.1.0
status: active
description: Family-specific workspace grammar for InfraStack assessment tools composed from shared `_base` workspace structure plus assessment-owned selected artifact review.
agent_map: templates/content/factory/phase-1/_family/assessment/FAMILY.md

family_path: templates/content/factory/phase-1/_family/assessment/
workspace_path: templates/content/factory/phase-1/_family/assessment/workspace/
scaffold_path: templates/content/factory/phase-2/_content/scaffold/
content_sections_path: templates/content/factory/phase-2/_content/sections/

reference_workspace:
    title: CIS Ubuntu Benchmark 2204
    path: templates/content/tools/cis/assess-ubuntu-2204-cis/
    aliases:
        - CIS Ubuntu Benchmark 2204
        - CIS Ubuntu 22.04 Benchmark
        - cis-ubuntu-benchmark-2204
        - assess-ubuntu-2204-cis
    role: Current working baseline reference for assessment workspace grammar.

runtime_baseline:
    source_tool: templates/content/tools/cis/assess-ubuntu-2204-cis/
    source_snapshot: templates/content/factory/phase-1/_family/assessment/source/
    workspace_sections: templates/content/factory/phase-1/_family/assessment/workspace/
    copy_mode: base_plus_family_contract
    css_js_mode: section_owned
    model_core: null
    model_core_sha256: null
    data_payload_source: templates/content/factory/phase-1/_family/assessment/source/assets/custom.json.twig
    data_payload_sha256: b8593d6097526c15bda181237cc599b229a4caff1d8faa46d8471ef1bbe3bc8c
    source_hashes:
        tool_html_twig: d9cef445d2909e737523b173ae94b12b55ece67ff953bf1837ed72d7b10a0a8b
        custom_css: 7826c5ae39bbe50145875a34912e44d0f5f4df7163fac56f9b2704542c9d600a
        custom_js: 78b269bbc8fd8d6d8cfe175cae312580d5f093392da3eac808706c8244eac12d
        custom_json_twig: b8593d6097526c15bda181237cc599b229a4caff1d8faa46d8471ef1bbe3bc8c
    role: The source snapshot is reference-only. Do not audit this as active source. Common workspace sections are sourced from `_base`; assessment workspace owns only selected artifact review.

selection_triggers:
    - assessment
    - assess
    - readiness
    - posture
    - compliance explorer
    - benchmark
    - control coverage
    - maturity
    - risk review

workspace_flow:
    - assessment_filter_or_query
    - scope_selectors
    - explicit_explore_or_assess_action
    - result_summary
    - output_toolbar_sort_copy_export_import
    - findings_or_controls_table
    - group_rollups
    - selected_artifact_review
    - json_snapshot_output_restore_when_implemented

workspace_namespaces:
    - family._base.workspace.00_shell
    - family._base.workspace.01_input-brief
    - family._base.workspace.02_basic-settings
    - family._base.workspace.03_custom-settings
    - family.assessment.workspace.04_selected-item
    - family._base.workspace.05_result-summary
    - family._base.workspace.06_output-toolbar
    - family._base.workspace.07_table-output
    - family._base.workspace.08_json-restore

workspace_sections:
    04_selected-item: selected script, rule, finding, requirement, evidence, or source body review
    _base.00_shell: shared workspace frame, panel rhythm, section slots, and responsive shell
    _base.01_input-brief: shared query, brief, assessment filter, and assess/explore action frame
    _base.02_basic-settings: shared scope, section, severity, status, profile, row-limit, and required selector frame
    _base.03_custom-settings: shared optional Custom settings panel frame
    _base.05_result-summary: shared matched counts, selected item, coverage, gaps, status, and metadata summary card frame
    _base.06_output-toolbar: shared ID-first sort, compact actions, copy, CSV, report, JSON, and optional import toolbar frame
    _base.07_table-output: shared findings/control table plus rollup, selected artifact, notes, and JSON shell
    _base.08_json-restore: shared assessment JSON snapshot output and optional restore handling frame

section_file_contract:
    required_per_section:
        - README.md
        - demo.html
        - page.html.twig
        - section.css
        - section.js
    role: Keep assessment-owned workspace sections structurally equivalent to architecture workspace sections while preserving assessment-specific behavior. Common sections are sourced from `_base/workspace`.

scaffold_content_adaptation:
    01_overview: assessment purpose, input boundary, output boundary, and trust boundary
    02_technical-details: catalogue source, normalized filters, result model, selected artifact loading, and export behavior
    03_example-prompts: assessment prompts or non-command example inputs with paired copy controls
    09_example-commands: literal assessment commands with paired Copy command controls
    example_terminal_title: centered title case
    04_tips-prompts: filter tips, review tips, and safe execution guidance when commands are shown
    05_how-to-use: assess, filter, inspect, copy, export, and review workflow
    06_export-notes: copy, CSV, PDF or print, JSON, and import restore boundaries
    07_faq: assessment trust boundaries and validation limitations
    08_acronyms: optional abbreviation expansion table; domain, benchmark, security, or operations acronyms
    11_glossary: optional broader terminology table; broader domain, command, workflow, platform, or estimate terminology
    10_references: complete factual content delivery, valid source-backed citations, and References rows when final assessment content cites sources

state_contract:
    - query_or_brief
    - scope_selectors
    - selected_item
    - row_limit
    - sort
    - summary_metrics
    - findings_or_controls_rows
    - group_rollups
    - selected_artifact
    - exports
    - json_output
    - json_restore_when_implemented

generation_rules:
    - Select this workspace source for assessment-family tool requests.
    - Compose assessment workspace output from `workspace_namespaces`, not from duplicated assessment copies of `_base` sections.
    - Source common shell, input, settings, summary, toolbar, table, and JSON restore sections from `_base/workspace`.
    - Keep each assessment-owned workspace section folder complete with README.md, demo.html, page.html.twig, section.css, and section.js.
    - When an assessment tool is accepted as a baseline, keep its full copied runtime source under source/ as a reference-only snapshot. Do not audit this as active source.
    - Keep reusable assessment-owned runtime behavior in section-owned page.html.twig, section.css, section.js, and demo.html files.
    - Keep only selected item, selected artifact, evidence detail, or source body behavior in assessment workspace files.
    - Use phase-2 content sections for reusable content rhythm.
    - Apply phase-2 content sections as a full contract: content.md markup, section.css visual behavior, and section.js helper behavior when present.
    - Final tool custom.css and custom.js must preserve the applied section card frame, heading divider, typography, table, list, details, FAQ, copy, citation, prompt, or command behavior unless a documented shared include exists.
    - Use 10_references for complete factual content delivery and when final content includes valid source-backed citations, with in-text citation links targeting matching References row IDs.
    - Do not create a family-local sections/ directory.
    - Do not copy CIS, Ubuntu, benchmark, shell, or compliance language into unrelated assessment tools.
    - Use the CIS Ubuntu Benchmark 2204 tool as the current working baseline reference for assessment UI composition.
    - Keep result summaries connected to current filter state and selected item.
    - Keep output toolbar controls boxed, compact, and grouped by sort versus actions.
    - Default stable rows to ID sorting.
    - Keep row copy actions in a dedicated copy/action column.
    - Keep support content tables aligned with fixed layout and wrapping.
    - Show Import JSON only when restore rebuilds the normalized model and visible outputs.
    - Preserve assessment-family filter-to-result grammar while adapting labels, category/provider tokens, examples, data sources, endpoints, and export behavior.
    - Generate final runtime files under templates/content/tools/<category>/<tool-slug>/.

validation_rules:
    - workspace/README.md exists.
    - workspace/manifest.yml exists.
    - workspace_namespaces lists `_base` common sections plus assessment-owned selected-item sections.
    - reference workspace path exists when used.
    - assessment-owned workspace section folders exist.
    - only assessment-owned workspace section folders remain.
    - source/tool.html.twig, source/custom.css, source/custom.js, and source/assets/custom.json.twig exist.
    - source/ is reference-only and must not be audited as active source.
    - root workspace/custom.css and workspace/custom.js do not exist.
    - every assessment-owned workspace section folder contains README.md, demo.html, page.html.twig, section.css, and section.js.
    - phase-2 content section source exists.
    - Applied shared content sections are validated in the final tool package for namespace markers, unresolved placeholders, required custom.css selectors, and helper hooks when used.
    - citation links and References rows are paired when 10_references is used.
    - no family-local sections/ directory exists.
    - final tool filters, summary, tables, exports, selected artifact, and JSON use one normalized model.
    - output toolbar, tabs shell, table shell, selected artifact view, and JSON panel match implemented behavior.
    - import restore is validated when shown.
