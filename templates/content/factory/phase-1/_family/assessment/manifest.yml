family: assessment
version: 1.1.0
status: active
description: Baseline template for InfraStack browser-first assessment tools composed from shared `_base` workspace structure plus assessment-owned selected artifact review.
baseline_snapshot: "2026-06-04"
agent_map: templates/content/factory/phase-1/_family/assessment/FAMILY.md

baseline_path: templates/content/factory/phase-1/_family/assessment/
preferred_baseline_path: templates/content/factory/phase-1/_family/assessment/
source_path: templates/content/factory/phase-1/_family/assessment/source/assess-ubuntu-2204-cis/
scaffold_path: templates/content/factory/phase-2/_content/scaffold/
content_sections_path: templates/content/factory/phase-2/_content/sections/

runtime_baseline:
    source_tool: templates/content/tools/cis/assess-ubuntu-2204-cis/
    source_snapshot: templates/content/factory/phase-1/_family/assessment/source/assess-ubuntu-2204-cis/
    source_package: templates/content/factory/phase-1/_family/assessment/source/assess-ubuntu-2204-cis/
    copy_mode: base_plus_family_contract
    css_js_mode: section_owned
    model_core: null
    model_core_sha256: null
    data_payload_source: templates/content/factory/phase-1/_family/assessment/source/assess-ubuntu-2204-cis/assets/custom.json.twig
    data_payload_sha256: 6d1bddb210e4beb64ae2ed86055df8a5139292c5aeb27658181c02c2857d9479
    tool_markup_sha256: 864389d98a882563ce24b4aa4c1e6adbde0dac7bf9d885ecf71e781bb911b650
    source_hashes:
        tool_html_twig: 864389d98a882563ce24b4aa4c1e6adbde0dac7bf9d885ecf71e781bb911b650
        custom_css: cfef8a76da929b019c20c3948d11b66bbec0d7773b2e73e0d8d983b0a8d8037c
        custom_js: d8c28c34fd784cad77897a52c18dc89ae7b226e52e095fe82f5b6f0cc556dbb8
        custom_json_twig: 6d1bddb210e4beb64ae2ed86055df8a5139292c5aeb27658181c02c2857d9479
    rule: Keep the full copied assessment source under source/assess-ubuntu-2204-cis/ as a reference-only full package snapshot. Audit it for freshness against production before using it as a seed. Use `_base/workspace` for common section shape and assessment workspace only for selected artifact review.

reference_tool:
    path: templates/content/tools/cis/assess-ubuntu-2204-cis/
    purpose: Current working baseline reference for assessment-family composition. Use the workflow grammar and quality bar, not CIS-specific wording.
    aliases:
        - CIS Ubuntu Benchmark 2204
        - CIS Ubuntu 22.04 Benchmark
        - cis-ubuntu-benchmark-2204
        - assess-ubuntu-2204-cis

applies_to:
    - compliance explorers
    - hardening assessment tools
    - readiness assessments
    - risk assessments
    - posture assessments
    - control coverage reviews
    - maturity assessments
    - configuration quality reviews
    - benchmark browsers

section_adaptation:
    content:
        01_overview: assessment purpose, input boundary, output boundary, and trust boundary
        02_technical-details: catalogue source, normalized filters, result model, selected artifact loading, and export behavior
        03_example-prompts: assessment prompts or non-command example inputs with paired copy controls
        09_example-commands: literal assessment commands with paired Copy command controls
        example_terminal_title: centered title case
        04_tips-prompts: filter tips, review tips, and safe execution guidance when commands are shown
        05_how-to-use: assess, filter, inspect, copy, export, and review workflow
        06_export-notes: copy, CSV, PDF or print, JSON, and import restore boundaries
        07_faq: assessment trust boundaries and validation limitations
        08_acronyms: optional abbreviation expansion table; domain, benchmark, security, or operations acronyms
        11_glossary: optional broader terminology table; broader domain, command, workflow, platform, or estimate terminology
        10_references: complete factual content delivery, valid source-backed citations, and References rows when final assessment content cites sources
    workspace:
        04_selected-item: selected script, rule, finding, requirement, evidence, or source body review
        _base.00_shell: shared workspace frame, panel rhythm, section slots, and responsive shell
        _base.01_input-brief: shared query, brief, assessment filter, and assess/explore action frame
        _base.02_basic-settings: shared scope, section, severity, status, profile, row-limit, and required selector frame
        _base.03_custom-settings: shared optional Custom settings panel frame
        _base.05_result-summary: shared matched counts, selected item, coverage, gaps, status, and metadata summary card frame
        _base.06_output-toolbar: shared ID-first sort, compact actions, copy, CSV, report, JSON, and optional import toolbar frame
        _base.07_table-output: shared findings/control table plus rollup, selected artifact, notes, and JSON shell
        _base.08_json-restore: shared assessment JSON snapshot output and optional restore handling frame

workspace_section_file_contract:
    required_per_section:
        - README.md
        - demo.html
        - page.html.twig
        - section.css
        - section.js
    role: Match the architecture family section bundle shape so each assessment workspace section has documentation, isolated demo markup, reusable Twig, scoped CSS, and scoped JavaScript.

required_output_files:
    - card.yml
    - content.md
    - custom.css
    - custom.js
    - meta.yml
    - tool.html.twig

optional_output_files:
    - assets/bin/model-core.js
    - assets/custom.json.twig
    - assets/icon/
    - assets/img/post.html.twig
    - src/Controller/Tools/<Category>/<Tool>/CustomController.php

required_first_line_markers:
    content.md: "[//]: # (content.md)"
    card.yml: "# card.yml"
    custom.css: "/* custom.css */"
    custom.js: "// custom.js"
    meta.yml: "# meta.yml"
    tool.html.twig: "{# tool.html.twig #}"

workspace_flow:
    - assessment_filter_or_query
    - scope_selectors
    - explicit_explore_or_assess_action
    - result_summary
    - output_toolbar_sort_copy_export_import
    - findings_or_controls_table
    - group_rollups
    - selected_artifact_review
    - json_snapshot_output_restore_when_implemented

source_namespaces:
    - family.assessment.workspace.04_selected-item
    - family._base.workspace.00_shell
    - family._base.workspace.01_input-brief
    - family._base.workspace.02_basic-settings
    - family._base.workspace.03_custom-settings
    - family._base.workspace.05_result-summary
    - family._base.workspace.06_output-toolbar
    - family._base.workspace.07_table-output
    - family._base.workspace.08_json-restore

export_priority:
    - copy_selected_artifact_or_row
    - CSV
    - JSON
    - PDF_or_print_report
    - Import_JSON_restore_when_implemented

generation_rules:
    - Use this family template as the baseline for assessment tools.
    - Use assess as the preferred family verb for new assessment tool identities.
    - Generate the final runtime package under templates/content/tools/<category>/<tool-slug>/.
    - Do not use the family directory as the final runtime package.
    - Do not omit tool-local files because the family source exists.
    - Compose assessment output from `source_namespaces`, not from duplicated assessment copies of `_base` sections.
    - Source common shell, input, settings, summary, toolbar, table, and JSON restore sections from `_base/workspace`.
    - Keep the full copied assessment source under source/assess-ubuntu-2204-cis/ as the approved production package snapshot.
    - Audit the source snapshot for freshness against templates/content/tools/cis/assess-ubuntu-2204-cis/ before using it as a seed; do not import it directly as active workspace section source.
    - Keep reusable assessment-owned behavior in namespace-marked source package runtime files.
    - Keep only assessment-specific selected item, selected artifact, evidence detail, or source body behavior in assessment workspace files.
    - Use CIS Ubuntu Benchmark 2204 as the current working baseline reference for assessment UI composition.
    - Do not copy CIS, Ubuntu, benchmark, shell, or compliance wording into unrelated assessment tools.
    - Apply category/provider token lineage, restrained visual weight, and tool-specific namespace.
    - Keep CSS and JavaScript scoped to the final tool.
    - Keep content domain-native and aligned with actual behavior.
    - Use the tokenized family source package from templates/content/factory/phase-1/_family/assessment/source/assess-ubuntu-2204-cis/.
    - Use shared content section source from templates/content/factory/phase-2/_content/sections/.
    - Apply phase-2 content sections as a full contract: content.md markup, section.css visual behavior, and section.js helper behavior when present.
    - Final tool custom.css and custom.js must preserve the applied section card frame, heading divider, typography, table, list, details, FAQ, copy, citation, prompt, or command behavior unless a documented shared include exists.
    - Use 10_references for complete factual content delivery and when final content includes valid source-backed citations, with in-text citation links targeting matching References row IDs.
    - Do not create a family-local sections/ directory.
    - Keep result areas hidden or in a pre-run notice state until the primary action or restore state generates output.
    - Keep stable assessment rows sorted by ID by default.
    - Keep row copy actions in a dedicated copy/action column.
    - Show Import JSON only when restore rebuilds the normalized model and visible outputs.
    - State assessment trust boundaries clearly.

validation_rules:
    - README.md exists.
    - manifest.yml exists.
    - source package folder exists.
    - source demo.html exists.
    - source_namespaces lists `_base` common sections plus assessment-owned selected-item sections.
    - Shared phase-2 content section source exists under templates/content/factory/phase-2/_content/sections/.
    - Applied shared content sections are validated in the final tool package for namespace markers, unresolved placeholders, required custom.css selectors, and helper hooks when used.
    - Citation links and References rows are paired when 10_references is used.
    - Assessment source namespace markers exist inside the source package runtime files.
    - Only the approved source package remains under templates/content/factory/phase-1/_family/assessment/source/.
    - Assessment-owned source namespace markers exist inside the source package runtime files.
    - source/ contains only source/assess-ubuntu-2204-cis/.
    - source/assess-ubuntu-2204-cis/card.yml, content.md, custom.css, custom.js, demo.html, meta.yml, tool.html.twig, assets/custom.json.twig, assets/bin/, assets/icon/, and assets/img/post.html.twig exist.
    - source/assess-ubuntu-2204-cis/ matches templates/content/tools/cis/assess-ubuntu-2204-cis/ file-for-file, except local Finder artifacts.
    - Root-level loose source/custom.css and source/custom.js do not exist.
    - No duplicated assessment sections/ directory exists under templates/content/factory/phase-1/_family/assessment/.
    - Required final output files are created in the final tool package.
    - Required first-line markers are present.
    - Tool namespace is unique.
    - CSS is scoped under the tool root.
    - JavaScript DOM references match Twig IDs.
    - Assessment output uses one normalized model.
    - Export controls match implemented exports.
    - Import controls appear only when JSON restore is implemented and validated.
    - JSON output matches the current result payload.
    - Summary, tables, selected artifact, exports, and JSON are generated from the same normalized model.
    - Copy controls target the matching current row, artifact, command, input, or JSON payload.
    - Support markdown tables do not clip required columns.
    - Content does not claim compliance, security, certification, or production readiness unless validated.
