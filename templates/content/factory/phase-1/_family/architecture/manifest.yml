                - family._base.workspace.01_input-brief
                - family._base.workspace.02_basic-settings
                - family._base.workspace.03_custom-settings
                - family._base.workspace.05_result-summary
                - family._base.workspace.06_output-toolbar
                - family._base.workspace.07_table-output
                - family._base.workspace.08_json-restore
            family_sections:
                - family.architecture.workspace.04_visual-contract
                - family.architecture.workspace.04_selected-item
            required_behaviors:
                - hidden_first
                - normalized_state
                - editable_stage
                - selected_item_editor
                - sort_state_sync
                - tab_state_sync
                - json_export_restore
            required_tabs:
                - Technical Inventory
                - Prompt Notes
                - Pillar Breakdown
                - Risk Level
                - JSON
            required_actions:
                - Export PNG
                - Download SVG
                - Copy JSON
                - Download JSON
                - Import JSON
            allowed_differences:
                - tool_title
                - provider_labels
                - domain_nodes
                - diagram_presets
                - stage_copy

