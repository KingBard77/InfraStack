    default_profile: editable_architecture
    profiles:
        editable_architecture:
            reference_tool: templates/content/tools/aws/architecture-vpc-aws/
            css_reference_mode: production_reference
            min_css_reference_coverage: 0.90
            min_css_section_coverage: 0.90
            base_contract_sections:
