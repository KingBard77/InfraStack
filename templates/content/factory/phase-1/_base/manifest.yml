# manifest.yml

source: base-workspace-contract
family: _base
version: 0.5.6
status: draft
description: Shared Phase 1 contract foundation for InfraStack workspace shape. Not a runtime catalogue family.

role:
    type: shared_family_foundation
    runtime_family: false
    catalogue_family: false
    final_tool_dependency: false

paths:
    family_path: templates/content/factory/phase-1/_base/
    workspace_path: templates/content/factory/phase-1/_base/workspace/

ownership:
    base: shared shape, layout rhythm, neutral control framing, and optional shell behavior
    family: state model, interaction meaning, output contract, visual surface, exports, and restore payload
    tool: provider or domain labels, exact controls, examples, formulas, parser terms, icons, and final runtime files

workspace_sections:
    00_shell: shared workspace frame, panel/grid wrappers, section rhythm, responsive rules, empty/loading/error surface shape
    01_input-brief: neutral primary input card for prompt, label, scenario, target, query, or first model input
    02_basic-settings: neutral basic settings card for high-frequency controls, helper chips, explicit control CSS, example input, and mobile-safe layout
    03_custom-settings: neutral compact Custom panel for optional controls, helper chips, explicit control CSS, placeholder examples, and count-based grouped override columns
    05_result-summary: neutral generated result summary card shell with a header row, aligned left and right big cards, metric cards, state chips, and optional ring visual
    06_output-toolbar: neutral sortable output toolbar with ID-first sort and five icon-ready output actions
    07_table-output: neutral tabbed output shell with table-first output, JSON-last output, table frame, empty state, and icon-only row actions

generation_rules:
    - Use this foundation only when creating or refreshing reusable family baselines.
    - Do not register `_base` in templates/content/tools/manifest.yml as a public runtime family.
    - Do not make final tool packages depend on `_base` files at runtime.
    - Adapt base placeholders before applying into family or final runtime files.
    - Use the input preference map in workspace/manifest.yml before inventing family-specific input brief variants.
    - Treat `workspace/manifest.yml` input brief runtime contract as the source of truth for required input, action, helper, error, and state-binding hooks.
    - Keep input brief variants in `workspace/manifest.yml`; do not create `_base/workspace/01_input-brief/variants/` folders for layout-only differences.
    - Use the basic settings preference map in workspace/manifest.yml before inventing family-specific basic setting variants.
    - Treat `workspace/manifest.yml` basic settings runtime contract as the source of truth for required control, dropdown, helper, example, and state-binding hooks.
    - Keep basic settings variants in `workspace/manifest.yml`; do not create `_base/workspace/02_basic-settings/variants/` folders for layout-only differences.
    - Use the custom settings preference map in workspace/manifest.yml before inventing family-specific custom setting variants.
    - Treat `workspace/manifest.yml` custom settings runtime contract as the source of truth for required disclosure, tab, dropdown, radio, checkbox, text, number, textarea, helper, and state-binding hooks.
    - Keep custom settings variants in `workspace/manifest.yml`; do not create `_base/workspace/03_custom-settings/variants/` folders for layout-only differences.
    - Use the result summary preference map in workspace/manifest.yml before inventing family-specific result summary variants.
    - Treat `workspace/manifest.yml` result summary runtime contract as the source of truth for required empty, error, generated, status chip, updated chip, primary card, summary card, metric, and hidden-first hooks.
    - Keep result summary variants in `workspace/manifest.yml`; do not create `_base/workspace/05_result-summary/variants/` folders for layout-only differences.
    - Use the output toolbar preference map in workspace/manifest.yml before inventing family-specific toolbar variants.
    - Use the table output preference map in workspace/manifest.yml before inventing family-specific tab shell and table frame variants.
    - Keep family-specific state, exact output tab meaning, exact table column schemas, exports, restore schemas, visual stages, formulas, parsers, scanners, and command logic outside `_base`.

validation_rules:
    - workspace/README.md exists.
    - workspace/manifest.yml exists.
    - each workspace section contains README.md, demo.html, page.html.twig, section.css, and section.js.
    - page.html.twig files use placeholders instead of provider-specific IDs.
    - section.css stays neutral and scoped under `.__TOOL_CLASS__`.
    - section.js exposes source metadata or neutral helpers only.
