# manifest.yml

source: base-workspace-contract
family: _base
version: 0.7.15
status: draft
description: Shared Phase 1 workspace contract for family baselines. Provides neutral shell, input, settings, custom settings, result summary, output toolbar, table output, and JSON restore sections.

workspace_path: templates/content/factory/phase-1/_base/workspace/

section_file_contract:
    required_per_section:
        - README.md
        - demo.html
        - page.html.twig
        - section.css
        - section.js

dropdown_visual_contract:
    source: manifest_and_section_css
    applies_to:
        02_basic-settings:
            role: Basic settings short native select dropdowns
            selector_family:
                - .__PREFIX__-native-select-wrap
                - .__PREFIX__-select
                - .__PREFIX__-select-control
        03_custom-settings:
            role: Custom settings short native select dropdowns
            selector_family:
                - .__PREFIX__-native-select-wrap
                - .__PREFIX__-custom-dropdown
                - .__PREFIX__-custom-native-select
                - .__PREFIX__-control-picker
        06_output-toolbar:
            role: Output toolbar sort dropdowns
            selector_family:
                - .__PREFIX__-sort-select
                - .__PREFIX__-sort-summary
                - .__PREFIX__-sort-menu
                - .__PREFIX__-sort-option
    summary_shape:
        min_height: 46px
        width: match parent control column
        text_alignment: left
        padding_rule: reserve right space for one arrow chip
    arrow_chip:
        size: 30px
        placement: right aligned inside the summary
        closed_state: visually centered down-facing chevron for native Basic and Custom selects; right-facing remains only for disclosures or CSS popup controls with observable open state
        open_state: down-facing chevron where open state is observable
        hover_state: no arrow-chip or chevron mutation for native Basic and Custom selects
        forbidden:
            - native summary marker
            - duplicate pseudo chevrons
            - up-arrow open state
    native_select_popup:
        applies_to:
            - 02_basic-settings
            - 03_custom-settings
        required_element: select
        popup_owner: browser
        allowed_styling:
            - closed control height
            - closed control border
            - closed control padding
            - closed control font
            - closed control focus ring
            - arrow chip wrapper
            - static centered down chevron
        forbidden_markup:
            - details based dropdowns
            - role listbox menus
            - role option buttons
            - hidden radio option rows
            - custom menu divs
        forbidden_css:
            - custom popup menu styling
            - custom option row styling
            - custom selected option styling
            - custom dropdown scrollbar styling
    long_dynamic_picker:
        applies_to:
            - 02_basic-settings
            - 03_custom-settings
        allowed_when:
            - option list is long, dynamic, or searchable
            - native popup direction or width cannot be made deterministic
        required_markup:
            - hidden canonical state input
            - trigger button with one fixed arrow chip
            - search input
            - in-page panel rendered directly below the trigger
            - listbox option area
        required_css:
            - picker root, trigger, panel, search input, and options area use `width: 100%`
            - picker root, trigger, panel, search input, and options area use `max-width: 100%`
            - picker root, trigger, panel, search input, and options area use `min-width: 0`
            - picker root, trigger, panel, search input, and options area use `box-sizing: border-box`
            - trigger uses `overflow: hidden`
            - label uses ellipsis for long selected values
            - arrow chip keeps a fixed 30px slot
            - options area uses bounded internal vertical scrolling when needed
        forbidden_css:
            - absolute or fixed panel positioning
            - z-index layering for the picker panel
            - detached popover placement
        runtime_rule: Keep the hidden state input synchronized with selected label, primary action output, URL/query state, export, and restore where those surfaces exist.
    popup_menu:
        applies_to:
            - 06_output-toolbar
        top_offset: 8px
        width: match closed summary width
        max_height: 280px
        overflow: internal vertical scroll
        z_index: 160
        parent_open_z_index: 140
        ancestor_rule: dropdown ancestors must keep overflow visible
    option_rows:
        applies_to:
            - 06_output-toolbar
        min_height: 42px
        row_shape: plain rows
        selected_state: soft accent background with accent text
        hover_state: same as selected state
        forbidden:
            - visible radio controls
            - nested option cards
            - row borders
            - row divider lines
            - row shadows
    scrollbar:
        applies_to:
            - 06_output-toolbar
        width: thin
        track: transparent
        thumb: subtle family or provider accent
    validation_rule: Short Basic and Custom dropdowns must be native selects with only closed-control styling. Long dynamic Basic or Custom lists may use the in-page searchable picker exception. Output toolbar sort may keep the shared CSS popup contract.

workspace_sections:
    00_shell:
        role: shared workspace frame
        owns:
            - namespace root wrapper
            - workspace grid
            - panel shell rhythm
            - section title rows
            - helper text rhythm
            - neutral empty/loading/error surface shape
            - responsive stacking
        does_not_own:
            - family state
            - output meaning
            - provider labels
    01_input-brief:
        role: neutral primary input card
        owns:
            - input card frame
            - input field frame
            - label and helper chip rhythm
            - primary action and Reset action row
            - icon-ready action buttons
            - stacked and inline input layouts
            - inline error slot
            - prompt, label, scenario, target, or query placeholder shape
            - stacked helper card alignment with the input control column
            - inline input stack single-column control width
        does_not_own:
            - parser behavior
            - calculation formulas
            - scanner probes
            - diagram generation
            - final state schema
        runtime_contract:
            contract_version: 2
            source_section: 01_input-brief
            variant_storage: manifest_only
            no_variant_subfolders: true
            required_dom_hooks:
                input:
                    source_id: __DOM_PREFIX__Input
                    allowed_elements:
                        - input
                        - textarea
                    required_classes:
                        - __PREFIX__-input-control
                    runtime_rule: Bind value changes to family or tool state before the primary action runs.
                primary_action:
                    source_id: __DOM_PREFIX__PrimaryAction
                    required_classes:
                        - __PREFIX__-action-btn
                        - __PREFIX__-action-btn-primary
                    runtime_rule: Validate the input and run the family-specific action. Do not leave this as a visual-only button.
                secondary_action:
                    source_id: __DOM_PREFIX__SecondaryAction
                    required_when_visible: true
                    required_classes:
                        - __PREFIX__-action-btn
                        - __PREFIX__-action-btn-secondary
                    runtime_rule: Reset to a valid first-view baseline, clear generated output, and keep the Reset icon visible.
                error_slot:
                    source_id: __DOM_PREFIX__InputError
                    required_classes:
                        - __PREFIX__-input-error
                    runtime_rule: Stay hidden by default and become visible only for validation or restore errors.
                helper_card:
                    required_classes:
                        - __PREFIX__-input-helper-card
                        - __PREFIX__-input-hint
                    runtime_rule: Explain the real input boundary for the selected family variant.
            required_data_attributes:
                - data-input-layout
            allowed_layouts:
                - stacked
                - inline
            required_runtime_behaviors:
                - primary action has an addEventListener handler in the final runtime package
                - visible Reset action has an addEventListener handler in the final runtime package
                - input value is validated before mutating generated output state
                - input error slot is hidden on valid input and shown with actionable copy on invalid input
                - helper text, label, placeholder, and action labels are family-native after adaptation
                - final runtime package preserves stable input, action, and error IDs after placeholder replacement
                - Reset clears generated output, result summary markup, errors, and generated JSON/table/command content
                - Reset returns inputs to a valid first-view baseline
                - preset-backed tools restore default preset prompt and controls instead of clearing preset-owned prompt text
                - primary and Reset icons remain visible during loading states
            forbidden_shortcuts:
                - creating family-specific input brief section folders only for label, icon, helper, or layout changes
                - showing a Reset button without implemented behavior
                - using Reset as a visible Load Default or unrelated secondary action
                - clearing a preset-owned prompt while leaving that preset selected
                - auto-running generated output on first view through the input section
                - shipping unresolved `__INPUT_*__`, `__PREFIX__`, or `__DOM_PREFIX__` placeholders
            family_owned_behaviors:
                - parser behavior
                - command generation
                - scan execution
                - calculation formulas
                - diagram generation
                - restore schema
    02_basic-settings:
        role: neutral basic settings card
        owns:
            - setting card frame
            - helper chip rhythm
            - example input card
            - short native select dropdowns with browser-owned popup menus and shared arrow-chip closed controls
            - optional long dynamic in-page searchable pickers when a native popup cannot meet direction or width requirements
            - explicit CSS hooks for native selects, text inputs, number inputs, textareas, placeholders, switches, and buttons
            - mobile one-column stacking
            - viewport-safe dropdown surface
        does_not_own:
            - family state model
            - preset catalog behavior
            - scanner request behavior
            - calculator formula behavior
            - shell command behavior
            - assessment filtering behavior
        runtime_contract:
            contract_version: 1
            source_section: 02_basic-settings
            variant_storage: manifest_only
            no_variant_subfolders: true
            required_dom_hooks:
                primary_control:
                    source_id: __DOM_PREFIX__BasicPrimary
                    allowed_elements:
                        - select
                        - input
                        - button
                    required_classes:
                        - __PREFIX__-native-select
                    runtime_rule: Bind high-frequency preset, scope, mode, or primary option changes to family or tool state.
                custom_select:
                    source_id: __DOM_PREFIX__BasicSelect
                    allowed_elements:
                        - select
                    required_classes:
                        - __PREFIX__-native-select
                        - __PREFIX__-select-control
                    required_wrapper_classes:
                        - __PREFIX__-native-select-wrap
                        - __PREFIX__-select
                    runtime_rule: Use a browser-owned native select popup; bind selected value to normalized state.
                text_control:
                    source_id: __DOM_PREFIX__BasicText
                    allowed_elements:
                        - input
                        - textarea
                    required_classes:
                        - __PREFIX__-text-field
                    runtime_rule: Persist typed setting values in normalized family or tool state.
                toggle_control:
                    source_id: __DOM_PREFIX__BasicToggle
                    allowed_elements:
                        - input
                    input_type: checkbox
                    required_wrapper_classes:
                        - __PREFIX__-switch-card
                    runtime_rule: Persist boolean setting state and keep visual switch state synchronized.
                example_card:
                    required_classes:
                        - __PREFIX__-example-card
                        - __PREFIX__-example-label
                        - __PREFIX__-example-value
                        - __PREFIX__-example-helper
                    runtime_rule: Show a real example or equivalent basic setting context after adaptation.
            required_runtime_behaviors:
                - every visible basic setting control updates normalized family or tool state
                - every visible basic setting control is read by the primary action or output renderer
                - short native select dropdown values update normalized family or tool state
                - long dynamic picker values update normalized family or tool state when rendered
                - text, number, URL, and textarea controls validate family-specific bounds before generated output state mutates
                - toggle controls keep checkbox semantics and synchronized visible state
                - mobile layout keeps controls full width and leaves dropdown popup behavior browser-owned
            forbidden_shortcuts:
                - creating family-specific basic settings section folders only for control labels or order
                - showing dropdowns, toggles, text fields, or mode buttons without state binding
                - implementing short Basic dropdowns with `details`, `role="listbox"`, button option rows, hidden radio option rows, custom menu divs, custom option hover styles, custom scrollbar styling, or custom selected-row CSS
                - showing a basic setting that is not consumed by generated output, export, or restore payloads
                - shipping unresolved `__BASIC_*__`, `__PREFIX__`, or `__DOM_PREFIX__` placeholders
            family_owned_behaviors:
                - preset catalog behavior
                - scanner request behavior
                - calculation formulas
                - shell command behavior
                - assessment filtering behavior
                - final state schema
    03_custom-settings:
        role: neutral compact Custom panel
        owns:
            - visible Custom disclosure label
            - compact chevron disclosure indicator
            - compact panel body rhythm
            - optional tab row and tab panel framing
            - card-contained custom controls
            - helper chip rhythm
            - example placeholders inside control cards
            - short native select dropdowns with browser-owned popup menus and shared arrow-chip closed controls
            - optional long dynamic in-page searchable pickers when a native popup cannot meet direction or width requirements
            - simple radio controls without radio cards
            - simple checkbox controls with switch-style visual rendering, neutral off color, and strong accent on color while preserving checkbox state semantics
            - dashed information rows for long helper details
            - grouped custom cards for many related custom controls
            - count-based inner columns for dense override or rate groups
            - one outer card per setting with no nested input, unit, prefix, or quantity cards
            - typed placeholder examples for CIDR, number, and quantity fields
            - explicit CSS hooks for inline dropdowns, simple radios, text inputs, number inputs, textareas, placeholders, checkboxes, info rows, and buttons
            - preference-driven one-column, count-based grouped-column, or multi-row layout
            - mobile one-column stacking
            - viewport-safe dropdown surface
        does_not_own:
            - family state model
            - tab activation behavior beyond source hooks
            - preset catalog behavior
            - scanner request behavior
            - calculator formula behavior
            - shell command behavior
            - assessment filtering behavior
        runtime_contract:
            contract_version: 1
            source_section: 03_custom-settings
            variant_storage: manifest_only
            no_variant_subfolders: true
            compatibility_sections:
                - 03_advanced-settings
                - 03_advanced-setting
            required_dom_hooks:
                disclosure:
                    source_id: __DOM_PREFIX__CustomSettings
                    allowed_elements:
                        - details
                    required_classes:
                        - __PREFIX__-custom-settings
                    visible_label: Custom
                    runtime_rule: Disclosure open state must be real and must not rely on decorative-only toggles.
                disclosure_summary:
                    required_classes:
                        - __PREFIX__-custom-summary
                        - __PREFIX__-custom-arrow-slot
                    runtime_rule: Show exactly one right-aligned arrow slot, pointing right by default and down when open.
                tab_buttons:
                    source_ids:
                        - __DOM_PREFIX__CustomTabOne
                        - __DOM_PREFIX__CustomTabTwo
                        - __DOM_PREFIX__CustomTabThree
                    required_classes:
                        - __PREFIX__-custom-tab
                    runtime_rule: Render only when tabs have real panels, and keep selected, hidden, tabindex, and aria state synchronized.
                tab_panels:
                    source_ids:
                        - __DOM_PREFIX__CustomPanelOne
                        - __DOM_PREFIX__CustomPanelTwo
                        - __DOM_PREFIX__CustomPanelThree
                    required_classes:
                        - __PREFIX__-custom-panel
                    runtime_rule: Hidden panels must use `hidden` or equivalent panel-scoped state, never broad CSS that hides the outer disclosure.
                text_control:
                    source_id: __DOM_PREFIX__CustomText
                    required_classes:
                        - __PREFIX__-custom-text-field
                    runtime_rule: Persist typed custom text state when rendered.
                dropdown:
                    source_id: __DOM_PREFIX__CustomSelect
                    allowed_elements:
                        - select
                    required_classes:
                        - __PREFIX__-custom-native-select
                    required_wrapper_classes:
                        - __PREFIX__-native-select-wrap
                        - __PREFIX__-custom-dropdown
                    runtime_rule: Use a browser-owned native select popup; bind selected value to normalized custom state.
                radio_controls:
                    source_ids:
                        - __DOM_PREFIX__CustomRadioStandard
                        - __DOM_PREFIX__CustomRadioOverride
                    required_wrapper_classes:
                        - __PREFIX__-custom-radio-card
                    runtime_rule: Preserve radio semantics and CSS-drawn visible state without exposing native radio controls.
                number_control:
                    source_id: __DOM_PREFIX__CustomNumber
                    required_classes:
                        - __PREFIX__-custom-number-field
                    runtime_rule: Persist numeric custom state and validate family-specific bounds when rendered.
                toggle_control:
                    source_id: __DOM_PREFIX__CustomToggle
                    required_wrapper_classes:
                        - __PREFIX__-custom-checkbox-option
                    runtime_rule: Preserve checkbox semantics and CSS-drawn switch state without exposing native checkbox controls.
                textarea_control:
                    source_id: __DOM_PREFIX__CustomTextarea
                    required_classes:
                        - __PREFIX__-custom-textarea
                    runtime_rule: Persist multiline notes, raw arguments, evidence notes, or output preferences when rendered.
                info_rows:
                    required_classes:
                        - __PREFIX__-custom-info
                    runtime_rule: Use dashed helper rows for long information that would crowd compact controls.
            required_runtime_behaviors:
                - visible disclosure label remains `Custom`
                - disclosure arrows have one arrow slot, point right by default, and point down when open
                - rendered tab buttons activate real panels and synchronize selected, hidden, tabindex, and aria state
                - visible dropdown, radio, checkbox, text, number, and textarea controls update normalized family or tool state
                - generated output, export payloads, and restore payloads read the same normalized custom state
                - short custom dropdown choices use native select popups with final state synchronization
                - long dynamic custom picker choices update normalized state and survive the primary action when rendered
                - custom number inputs validate bounds and hide browser-native spinner boxes
                - mobile layout keeps controls full width and leaves dropdown popup behavior browser-owned
            forbidden_shortcuts:
                - creating family-specific custom settings section folders only for control labels, tabs, or layout
                - showing `Advanced` as the visible disclosure label
                - showing dropdowns, toggles, radios, tabs, text fields, number fields, or textareas without state binding
                - showing a custom control that is not consumed by generated output, export, restore, filtering, validation, or command/model generation
                - using broad panel CSS that can hide the outer Custom disclosure
                - showing duplicate arrows, native disclosure markers, or up arrows for open state
                - implementing short Custom dropdowns with `details`, `role="listbox"`, button option rows, custom menu divs, custom option hover styles, custom scrollbar styling, or custom selected-row CSS
                - shipping unresolved `__CUSTOM_*__`, `__PREFIX__`, or `__DOM_PREFIX__` placeholders
            family_owned_behaviors:
                - topology override behavior
                - calculation assumption behavior
                - shell flag and raw argument behavior
                - scanner probe behavior
                - assessment filter behavior
                - final state schema
    05_result-summary:
        role: neutral generated result summary cards
        owns:
            - empty and error result callout shape
            - generated result card shell
            - top result header with status and updated chips
            - left primary result card and right summary card rhythm
            - optional result ring card for architecture, calculate, and scanning
            - shell-compatible primary result card replacement rhythm
            - aligned metric card grid
            - metric icon badge and accent bar rhythm
            - outlined pill chips with icon slots
            - success, warning, error, baseline, ready, and need-work chip tones
            - text wrapping inside all result cards
            - mobile one-column stacking
        does_not_own:
            - family result state model
            - score formulas
            - calculation formulas
            - scanner probes
            - shell command generation
            - assessment filtering behavior
            - export or restore payloads
        runtime_contract:
            contract_version: 1
            source_section: 05_result-summary
            variant_storage: manifest_only
            no_variant_subfolders: true
            compatibility_sections:
                - 05_result-summary
                - 05_score-card
                - 07_score-card
            required_dom_hooks:
                empty_state:
                    source_id: __DOM_PREFIX__ResultEmpty
                    required_classes:
                        - __PREFIX__-result-empty
                    runtime_rule: Show only before generation or after reset when no generated result exists.
                error_state:
                    source_id: __DOM_PREFIX__ResultError
                    required_classes:
                        - __PREFIX__-result-error
                    runtime_rule: Stay hidden by default and show actionable error copy without stale generated values.
                generated_summary:
                    source_id: __DOM_PREFIX__ResultSummary
                    required_classes:
                        - __PREFIX__-result-summary
                    runtime_rule: Render only from normalized result state after the family or tool action completes.
                primary_visual:
                    source_id: __DOM_PREFIX__ResultVisual
                    required_classes:
                        - __PREFIX__-result-primary-visual
                    runtime_rule: Reflect the primary generated value, score, status, command mode, row count, or artifact metric.
                result_header_title:
                    required_classes:
                        - __PREFIX__-result-header-title
                    required_text: Result Summary
                    runtime_rule: Start at the top of the result card with no blank gap before the heading.
                status_chip:
                    required_classes:
                        - __PREFIX__-result-header-chip
                    runtime_rule: Show a real generated, estimated, completed, ready, warning, or error state.
                updated_chip:
                    required_classes:
                        - __PREFIX__-result-chip-updated
                    runtime_rule: Show a real generated or updated timestamp label owned by runtime state.
                primary_card:
                    required_classes:
                        - __PREFIX__-result-card-primary
                    runtime_rule: Stay aligned as the left primary card on desktop and first card on mobile.
                summary_card:
                    required_classes:
                        - __PREFIX__-result-card-summary
                    runtime_rule: Stay aligned as the right descriptive summary card on desktop and second card on mobile.
                metric_cards:
                    required_classes:
                        - __PREFIX__-result-metric-card
                        - __PREFIX__-result-metric-value
                        - __PREFIX__-result-metric-accent
                    runtime_rule: Render real generated metric values with bottom accent bars aligned across cards.
            required_runtime_behaviors:
                - empty, error, and generated summary states are mutually exclusive
                - hidden-first families do not show generated summary values on first view
                - generated summary values come from normalized result state
                - status and updated chips are runtime values, not static placeholders
                - primary and descriptive summary cards stay aligned on desktop and stack cleanly on mobile
                - metric cards render real generated values and remain aligned even with wrapped copy
                - result heading starts flush inside the card without an empty band above it
                - result tone uses approved state tokens and does not recolor the whole card for warning states
                - export and JSON payloads agree with visible result values when those surfaces exist
            forbidden_shortcuts:
                - creating family-specific result summary section folders only for labels, icons, visual kind, or metric names
                - showing generated result values before the user action when the family requires hidden-first behavior
                - leaving empty or error states visible with stale generated values
                - showing static placeholder metrics that are not generated from state
                - claiming certification, compliance, security, production readiness, billing accuracy, or validation unless separately proven
                - shipping unresolved `__RESULT_*__`, `__PREFIX__`, or `__DOM_PREFIX__` placeholders
            family_owned_behaviors:
                - result state model
                - score formulas
                - calculation formulas
                - scanner probes and findings
                - shell command generation
                - assessment filtering behavior
                - export and restore payloads
    06_output-toolbar:
        role: neutral sortable output toolbar
        owns:
            - one Sort label and custom CSS dropdown control
            - ID-first visible sort default
            - hidden `id` default sort value
            - dropdown menu width matching the closed summary
            - overflow-visible toolbar and dropdown wrappers
            - open dropdown layering above nearby cards
            - exactly five icon-ready output action buttons
            - compact square-like action button radius
            - desktop right-aligned action layout
            - mobile full-width stacking
        does_not_own:
            - family sort state model
            - table row sorting behavior
            - export payload generation
            - restore validation
            - output tab content
            - provider or domain labels
    07_table-output:
        role: neutral tabbed table output shell
        owns:
            - five top-level tab section rhythm
            - tab section align right on desktop
            - one-line horizontally scrollable tab section when tabs exceed width
            - flat output tab states without shadow or lifted transform
            - runtime override requirement for older tool-local active-tab shadows
            - first tab as table output
            - last tab as JSON output
            - rounded icon-bearing tab buttons
            - section cards with visible titles before output
            - top-aligned section and command header rows when titles share a row with copy or action buttons
            - primary, secondary, and tertiary table frame shape
            - empty row and empty output state shape
            - centered `#` first column convention
            - logical start alignment for middle table columns
            - centered status-like label column convention
            - centered row action final column convention
            - sticky final row action column on multi-column horizontally scrolling tables
            - flat sticky action column without side shadow
            - 2-3 line clamp rhythm for generated row text
            - optional fifth placeholder tab and table panel before JSON
            - icon-only row copy action shape
            - compact note cards for non-table supporting output
            - JSON panel frame and scroll behavior
            - mobile one-line tab scrolling and table overflow behavior
        does_not_own:
            - family output state model
            - generated row meaning
            - exact final column schema
            - row sorting behavior
            - row copy payload generation
            - export payload generation
            - restore validation
            - scanner probes
            - calculation formulas
            - command generation
            - provider or domain labels
    08_json-restore:
        role: neutral JSON output and restore frame
        owns:
            - framed JSON output card
            - neutral non-section JSON card source markup
            - global section padding reset for JSON card frames
            - visible JSON title and helper rhythm
            - hidden restore status slot
            - explicit empty JSON state
            - scrollable JSON code frame
            - default JSON syntax token colors
            - hidden JSON import file input
            - mobile-readable JSON frame
        does_not_own:
            - family JSON schema
            - payload construction
            - import validation
            - restore mapping
            - state mutation
            - export file naming
            - provider or domain labels

