input_brief_preferences:
    generic:
        variant: stacked_prompt
        layout: stacked
        input_kind: textarea
        rows: 4
        label: Primary input
        placeholder: Describe the model, target, scenario, or request.
        helper_chip: Explain the expected input boundary.
        helper_text: Provide the minimum information needed to build the model, then review generated output before exporting.
        primary_action:
            label: Run
            icon: bi-play-fill
        secondary_action:
            required: true
            label: Reset
            icon: bi-arrow-counterclockwise
    architecture:
        variant: stacked_prompt
        layout: stacked
        input_kind: textarea
        rows: 7
        label: Architecture prompt
        placeholder: Describe topology, placement, ingress, private tiers, shared services, and export requirements.
        helper_chip: Describe the architecture prompt boundary.
        helper_text: Use one brief prompt with region, zone count, ingress, private tiers, supporting services, and any output expectations.
        primary_action:
            label: Generate Diagram
            icon: bi-stars
        secondary_action:
            required: true
            label: Reset
            icon: bi-arrow-counterclockwise
    calculate:
        variant: inline_label
        layout: inline
        input_kind: text
        rows: 1
        label: Estimate label
        placeholder: Production API stack
        helper_chip: Name the workload or environment being estimated.
        helper_text: Use a short label that can travel with exported estimate data.
        primary_action:
            label: Estimate
            icon: bi-calculator
        secondary_action:
            required: true
            label: Reset
            icon: bi-arrow-counterclockwise
    shell:
        variant: inline_target
        layout: inline
        input_kind: text
        rows: 1
        label: Target path
        placeholder: ./deploy.sh
        helper_chip: Identify the path, command target, or script scope.
        helper_text: Use a concrete path, command target, or scope before generating shell output.
        primary_action:
            label: Generate
            icon: bi-terminal
        secondary_action:
            required: true
            label: Reset
            icon: bi-arrow-counterclockwise
    scanning:
        variant: inline_url
        layout: inline
        input_kind: url
        rows: 1
        label: URL target
        placeholder: https://example.com
        default: http://example.com/
        helper_chip: Enter the target URL or bounded scan target.
        helper_text: Use a valid target and review evidence before treating scan output as actionable.
        primary_action:
            label: Scan
            icon: bi-search
        secondary_action:
            required: true
            label: Reset
            icon: bi-arrow-counterclockwise
    assessment:
        variant: inline_filter
        layout: inline
        input_kind: text
        rows: 1
        label: Control filter
        placeholder: 1.1.1.1, ssh, auditd
        helper_chip: Filter controls by ID, service, package, or keyword.
        helper_text: Filter the assessment scope before reviewing control evidence and output.
        primary_action:
            label: Explore
            icon: bi-search
        secondary_action:
            required: true
            label: Reset
            icon: bi-arrow-counterclockwise

