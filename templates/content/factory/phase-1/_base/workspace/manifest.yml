custom_settings_runtime_contract:
    source_section: 03_custom-settings
    namespace: family._base.workspace.03_custom-settings
    contract_version: 1
    storage_rule: Keep one flat source folder. Store variant rules in this manifest, not in variant subfolders.
    compatibility_sections:
        - 03_advanced-settings
        - 03_advanced-setting
    visible_label: Custom
    required_source_files:
        - README.md
        - demo.html
        - page.html.twig
        - section.css
        - section.js
    required_markup:
        root_classes:
            - __PREFIX__-custom-settings
            - __PREFIX__-custom-summary
            - __PREFIX__-custom-body
        data_attributes:
            - data-custom-layout
        hooks:
            disclosure: __DOM_PREFIX__CustomSettings
            tab_one: __DOM_PREFIX__CustomTabOne
            tab_two: __DOM_PREFIX__CustomTabTwo
            tab_three: __DOM_PREFIX__CustomTabThree
            panel_one: __DOM_PREFIX__CustomPanelOne
            panel_two: __DOM_PREFIX__CustomPanelTwo
            panel_three: __DOM_PREFIX__CustomPanelThree
            text_control: __DOM_PREFIX__CustomText
            dropdown: __DOM_PREFIX__CustomSelect
            radio_standard: __DOM_PREFIX__CustomRadioStandard
            radio_override: __DOM_PREFIX__CustomRadioOverride
            number_control: __DOM_PREFIX__CustomNumber
            toggle_control: __DOM_PREFIX__CustomToggle
            textarea_control: __DOM_PREFIX__CustomTextarea
    required_final_runtime:
        - final Custom disclosure exists when optional settings are rendered
        - visible disclosure label is `Custom`, even when compatibility namespace markers use advanced wording
        - visible tab IDs and panel IDs exist and are referenced by JavaScript when tabs are rendered
        - visible dropdown, radio, checkbox, text, number, and textarea controls have real state-binding handlers
        - disclosure arrows use one arrow slot, point right by default, and point down when open
        - native select dropdown values update normalized custom state
        - generated output, export payloads, and restore payloads read the same normalized custom state
        - fake Custom controls are removed instead of shown
    allowed_adaptations:
        - remove unused source controls when the final tool has no real matching optional setting
        - preserve compatibility namespace markers `03_advanced-settings` or `03_advanced-setting` when existing stable packages require them
        - preserve stable existing final-tool IDs when reapplying to an existing runtime package
        - collapse tabs into one compact panel when the family variant does not need multiple real panels
    forbidden_adaptations:
        - duplicating the source section into family-specific folders for layout-only, tab-only, or label-only differences
        - showing `Advanced` as the visible disclosure label
        - rendering fake controls that do not update normalized state
        - showing duplicate arrows, native disclosure markers, or up arrows for open state
        - using unresolved placeholders in final tool files
        - treating namespace markers as proof that runtime behavior exists

