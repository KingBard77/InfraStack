generation_rules:
    - Apply `00_shell` before family-specific workspace sections when a family needs the common workspace frame.
    - Adapt `01_input-brief` into a prompt textarea, label input, target input, scenario input, or query input as the family requires.
    - Use `data-input-layout="stacked"` for large prompt cards and `data-input-layout="inline"` for compact label, target, URL, or filter rows.
    - Select the input brief preference from `input_brief_preferences` before creating family-specific variants.
    - Treat `input_brief_runtime_contract` as mandatory when applying `01_input-brief`; visual differences must come from `input_brief_variants` and `input_brief_preferences`.
    - Do not create `01_input-brief/variants/` folders. Keep variants as manifest data until generator code needs separate source files.
    - Keep one canonical `01_input-brief` source section; preferences fill placeholders and may remove unsupported actions.
    - Keep section CSS neutral enough to inherit family category/provider tokens after adaptation.
    - Keep section JavaScript as metadata or optional neutral helpers; final behavior belongs to family or tool JavaScript.
    - Treat `dropdown_visual_contract` as mandatory for every Basic, Custom, or Output toolbar dropdown; short Basic and Custom lists use native select popups, long dynamic Basic and Custom lists may use the in-page searchable picker exception, and Output toolbar sort may keep the shared CSS popup shape.
    - Select the basic settings preference from `basic_settings_preferences` before creating family-specific variants.
    - Treat `basic_settings_runtime_contract` as mandatory when applying `02_basic-settings`; visual and control differences must come from `basic_settings_variants` and `basic_settings_preferences`.
    - Do not create `02_basic-settings/variants/` folders. Keep variants as manifest data until generator code needs separate source files.
    - Keep one canonical `02_basic-settings` source section; preferences fill labels, helper copy, examples, and expected control emphasis.
    - Do not add visible `Basic settings` title or subtitle copy to final runtime tools unless the tool already has a native section heading that must be preserved.
    - Skip `02_basic-settings` for tools that do not have real high-frequency basic controls.
    - Do not add outlined pill chips when they only duplicate the selected dropdown summary or placeholder.
    - When an outlined reset, default, or scope pill chip provides a distinct action, keep it in the left label column; the right column should hold the active control, selected value, placeholder, hidden field, or dropdown surface only.
    - Every applied basic setting field must be inside a card and have CSS for placeholder, focus, disabled, hover, mobile, and selected states where relevant.
    - Short Basic dropdowns must be native `<select>` controls inside the standard arrow-chip wrapper. Do not add custom popup menus, listbox buttons, hidden radio option rows, custom option styling, or dropdown scrollbar CSS for short lists.
    - Repeated peer-card editors inside Basic settings must span the full setting width with the group label above the grid, not reserve a left label rail beside nested cards.
    - Select the custom settings preference from `custom_settings_preferences` before creating family-specific variants.
    - Treat `custom_settings_runtime_contract` as mandatory when applying `03_custom-settings`; visual and control differences must come from `custom_settings_variants` and `custom_settings_preferences`.
    - Do not create `03_custom-settings/variants/` folders. Keep variants as manifest data until generator code needs separate source files.
    - Keep one canonical `03_custom-settings` source section; preferences fill tab names, placeholder examples, control emphasis, density, row shape, and column behavior.
    - Use visible `Custom` copy for the disclosure label even when preserving existing `03_advanced-settings` or `03_advanced-setting` namespace markers.
    - Skip `03_custom-settings` for tools that do not have real optional/custom controls.
    - Every applied custom setting field must be inside a card and have CSS for placeholder, focus, disabled, hover, mobile, and selected states where relevant.
    - Short Custom dropdowns must be native `<select>` controls inside the standard arrow-chip wrapper. Do not add custom popup menus, listbox buttons, custom option styling, or dropdown scrollbar CSS for short lists.
    - Long dynamic Basic or Custom pickers must stay inside the setting card, open below the trigger, provide search, keep the selected value synchronized with hidden state, and pass the width-containment gate.
    - Use simple radio inputs for Custom; do not adapt Custom radio choices as card buttons unless a tool-specific behavior explicitly requires it.
    - Use simple checkbox inputs for Custom; render them with neutral-off and strong-accent-on switch-style CSS without converting them to switch-card markup.
    - Keep each Custom setting to one outer card. Do not put another card around the active input, unit, currency prefix, quantity value, or placeholder.
    - Within a Custom setting card, place the label and helper chip first, the active control second, and explanatory text below the control. Put group-level information above related compact controls as dashed text rows.
    - Match placeholder examples to the field type: CIDR/network fields use slash notation such as `10.0.0.0/16`, number fields use numeric examples, and quantity fields use quantity examples with units outside the input.
    - Separate Custom subsections with spacing, not divider lines.
    - When many custom cards are present, organize related settings as outer grouped cards before aligning controls inside each card.
    - Dense override or rate groups must use one outer grouped card per row. Inside each grouped card, one field uses one column, two fields use two columns, and three or more fields use three columns on desktop.
    - Neutralize shared span helpers inside override group bodies so a third field cannot force a second full-width row.
    - Long informational helper text should use dashed info rows that can wrap into columns or rows.
    - Select the result summary preference from `result_summary_preferences` before creating family-specific variants.
    - Treat `result_summary_runtime_contract` as mandatory when applying `05_result-summary`; visual and metric differences must come from `result_summary_variants` and `result_summary_preferences`.
    - Do not create `05_result-summary/variants/` folders. Keep variants as manifest data until generator code needs separate source files.
    - Keep one canonical `05_result-summary` source section; preferences fill header labels, result tone, visual kind, chip labels, metric labels, icons, and generated copy.
    - Use result summary as the shared visual rhythm for existing family slots such as `05_result-summary`, `05_score-card`, and `07_score-card` when the result surface is summary-card based.
    - The generated result summary must stay inside a card with a top header row, and all text must wrap inside its parent card.
    - Use outlined pill chips with icon slots and state tones: success, warning, error, baseline, ready, and need-work.
    - Keep the left primary result card and right summary card aligned; use the left card for a ring when the family is architecture, calculate, or scanning.
    - Put the primary result kicker above the ring, then center the result title, copy, and outcome chip below the ring.
    - Shell families may adapt the left primary card into compact command, mode, route, or comparison text while preserving the same grid rhythm; do not show a full direct command in the primary result card.
    - Estimate summaries should use the right summary card with a title, short summary, and four to six outlined chips including updated date/time.
    - Metric cards should include an icon badge and bottom accent bar when adapted to assessment, calculate, generator, scanning, or shell summaries.
    - The result shell must inherit family/category/provider color tokens; only state chips should use success, warning, error, baseline, ready, and need-work tones.
    - Do not put validation, certification, billing accuracy, compliance, security, or production-readiness claims in this section unless those outcomes are actually validated.
    - Select the output toolbar preference from `output_toolbar_preferences` before creating family-specific variants.
    - Keep one canonical `06_output-toolbar` source section; preferences fill sort options, action labels, action icons, and action IDs.
    - Output toolbar sort dropdown summaries, arrow chips, popup menus, option rows, selected states, scrollbars, and z-index values must match `dropdown_visual_contract`.
    - Use output toolbar as the shared visual rhythm for existing family slots such as `06_sort-card`, `07_table-export`, and `08_sort-card` when a sortable output action bar is needed.
    - Keep `ID` as the first visible sort option and `id` as the hidden default sort value.
    - Keep the custom sort dropdown menu the same width as the closed sort summary.
    - Keep toolbar wrappers and dropdown wrappers overflow-visible so the menu is not clipped behind the next card.
    - Use exactly five output action buttons, right-aligned on desktop and full-width stacked on mobile.
    - Every output action button must include an icon and compact square-like corners.
    - Do not show an action unless the family or final tool implements the matching behavior.
    - Select the table output preference from `table_output_preferences` before creating family-specific variants.
    - Keep one canonical `07_table-output` source section; preferences fill tab labels, tab icons, table titles, compact column labels, empty text, and note labels.
    - Use table output as the shared visual rhythm for existing family slots such as `07_table`, `07_table-export`, and `09_result-table` when a detailed tabbed output surface is needed.
    - Keep at least five top-level output tabs after adaptation.
    - Keep the table output tab section align right on desktop and horizontally scrollable on one line when tabs exceed width.
    - Keep the first top-level output tab as a table section.
    - Use the fifth tab and panel as an optional extra placeholder section before JSON when a family needs more output sections.
    - Keep the final top-level output tab as JSON.
    - Every output tab button must be rounded and include an icon.
    - Every output panel must include a visible section title inside the section card before generated output.
    - Section or command titles that share a row with copy/action buttons must use a two-column top-aligned header grid.
    - Keep generated tables compact and meaningful. Do not add columns only because data exists in state.
    - The first table column must be a centered `#` column.
    - Middle table columns must use logical start alignment.
    - The final table column must be a centered row action column.
    - The final row action column must be sticky when a multi-column table scrolls horizontally.
    - Row action buttons must be icon-only copy buttons with accessible labels.
    - Generated row text should use `.__PREFIX__-table-cell-text` or `.__PREFIX__-cell-clamp` and stay clamped to 2-3 lines.
    - Empty table states must stay inside the table frame.
    - Mobile layouts must preserve one-line scrollable output tabs, horizontal table scrolling when needed, and readable JSON.
    - Select the JSON restore preference from `json_restore_preferences` before creating family-specific variants.
    - Keep one canonical `08_json-restore` source section; preferences fill JSON panel labels, helper copy, empty text, and accepted import type.
    - Use JSON restore as the shared visual rhythm for existing family slots such as `08_json-restore`, `09_result-table`, and `07_table` when a JSON output/import/restore frame is needed.
    - Keep JSON output inside a framed card with a visible title before the code frame.
    - Use a neutral `div` with `role="region"` for the JSON card in the base source; do not emit a `section` JSON card from `_base`.
    - Reset global `section` padding on the JSON card when final compatibility markup must keep a `section` element so the header is flush to the framed card top.
    - Keep a restore status slot near the JSON frame and do not use it to imply validation that did not run.
    - Keep empty JSON state explicit and separate from generated JSON output.
    - Keep imported JSON file input scoped, hidden when needed, and configured for JSON files.
    - Apply JSON syntax color highlighting by default and keep long JSON horizontally scrollable.
    - Family and final tool code must parse and validate imported JSON before mutating state.
    - Do not make restore depend on prompt replay alone.

input_brief_selection:
    source_section: 01_input-brief
    canonical_source_only: true
    runtime_contract: input_brief_runtime_contract
    variant_source: input_brief_variants
    preference_source: input_brief_preferences
    selection_order:
        - explicit_user_family
        - existing_tool_family_metadata
        - dominant_behavior
        - category_fallback
        - generic_default
    category_fallbacks:
        cloud: architecture
        security: scanning
        cis: assessment
        shell: shell
    rule: Use the matching preference to fill placeholders. Do not duplicate the source section for each family.

input_brief_runtime_contract:
    source_section: 01_input-brief
    namespace: family._base.workspace.01_input-brief
    contract_version: 2
    storage_rule: Keep one flat source folder. Store variant rules in this manifest, not in variant subfolders.
    required_source_files:
        - README.md
        - demo.html
        - page.html.twig
        - section.css
        - section.js
    required_markup:
        root_classes:
            - __PREFIX__-input-card
            - __PREFIX__-input-brief
        data_attributes:
            - data-input-layout
        hooks:
            input: __DOM_PREFIX__Input
            primary_action: __DOM_PREFIX__PrimaryAction
            secondary_action: __DOM_PREFIX__SecondaryAction
            error_slot: __DOM_PREFIX__InputError
    required_final_runtime:
        - final input ID exists and is referenced by JavaScript
        - final primary action ID exists and has a real click handler
        - final Reset action ID exists and has a real click handler
        - final error slot exists when JavaScript can reject or restore input
        - final input value is persisted in normalized family or tool state
        - final primary action validates input before rendering generated output
        - final first view does not auto-render generated output when the selected family requires hidden-first results
        - final Reset action clears generated output state and returns the result area to the empty shell
        - final Reset action clears validation, loading, import, and result errors
        - final Reset action clears generated result summary markup and generated JSON/table/command content
        - final Reset action clears share or URL query state when reset changes restored state
        - preset-backed final tools restore default preset prompt and controls on Reset while keeping generated output hidden
        - non-preset final tools restore an authored valid baseline and may clear the input only when placeholder-first input is valid
        - primary and Reset icons remain visible during loading states
    allowed_adaptations:
        - replace textarea with input for inline text, URL, label, target, or filter variants
        - change icons, labels, helper text, placeholders, and row count to family-native copy
        - preserve stable existing final-tool IDs when reapplying to an existing runtime package
    forbidden_adaptations:
        - duplicating the source section into family-specific folders for layout-only differences
        - rendering native browser popups or cards inside the input brief action row
        - leaving a visible action button without an implemented handler
        - removing the visible Reset action from a complete final tool without an explicit recorded exception
        - labeling the Reset action as Load Default or another unrelated secondary command
        - clearing preset-owned prompt text while leaving the preset selected
        - using unresolved placeholders in final tool files

