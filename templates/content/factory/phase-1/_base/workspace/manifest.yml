result_summary_runtime_contract:
    source_section: 05_result-summary
    namespace: family._base.workspace.05_result-summary
    contract_version: 1
    storage_rule: Keep one flat source folder. Store variant rules in this manifest, not in variant subfolders.
    compatibility_sections:
        - 05_result-summary
        - 05_score-card
        - 07_score-card
    required_source_files:
        - README.md
        - demo.html
        - page.html.twig
        - section.css
        - section.js
    required_markup:
        root_classes:
            - __PREFIX__-result-summary
            - __PREFIX__-result-header
            - __PREFIX__-result-hero-grid
        state_hooks:
            empty_state: __DOM_PREFIX__ResultEmpty
            error_state: __DOM_PREFIX__ResultError
            generated_summary: __DOM_PREFIX__ResultSummary
            primary_visual: __DOM_PREFIX__ResultVisual
        card_classes:
            - __PREFIX__-result-card-primary
            - __PREFIX__-result-card-summary
            - __PREFIX__-result-metric-card
        required_heading: Result Summary
    required_final_runtime:
        - final empty, error, and generated result IDs exist when JavaScript references them
        - empty, error, and generated states are mutually exclusive
        - final first view keeps generated summary hidden when the selected family requires hidden-first output
        - generated values, chips, and metric cards come from normalized result state
        - status and updated chips use real runtime labels and timestamps
        - primary card and descriptive summary card stay aligned on desktop and stack on mobile
        - metric values agree with JSON/export payload values when those surfaces exist
        - result heading starts at the top of the result card without a blank band
    allowed_adaptations:
        - use ring, icon, SVG, metric, number, decimal, text, status, command, or pill as the primary visual
        - preserve compatibility namespace markers `05_score-card` or `07_score-card` when existing stable packages require them
        - preserve stable existing final-tool IDs when reapplying to an existing runtime package
        - remove metric cards only when the family variant has no real generated metrics and no placeholder cards remain
    forbidden_adaptations:
        - duplicating the source section into family-specific folders for label, visual-kind, chip, or metric differences
        - showing generated result values before user action in hidden-first families
        - showing static placeholder metric cards that are not generated from state
        - showing stale generated values inside empty or error states
        - claiming certification, compliance, security, production readiness, billing accuracy, or validation unless separately proven
        - using unresolved placeholders in final tool files

