table_output_preferences:
    generic:
        aria_label: Generated output views
        empty_text: Generate output to review table rows, supporting sections, and JSON.
        tabs:
            - label: Breakdown
              icon: bi-list-check
            - label: Details
              icon: bi-grid-3x3-gap
            - label: Assumptions
              icon: bi-card-list
            - label: Notes
              icon: bi-card-text
            - label: More
              icon: bi-plus-circle
            - label: JSON
              icon: bi-braces
        primary:
            title: Primary Breakdown
            columns:
                - Item
                - Type
                - Summary
            empty: Generated rows appear here.
        secondary:
            title: Detail Matrix
            columns:
                - Section
                - Value
                - Note
            empty: Detail rows appear here.
        tertiary:
            title: Assumptions
            columns:
                - Assumption
                - Value
                - Source
            empty: Assumption rows appear here.
        extra:
            title: More Output
            columns:
                - Section
                - Value
                - Note
            empty: Extra output rows appear here when this section is needed.
        notes:
            title: Output Notes
            items:
                - title: Advantage
                  copy: Use this section for concise generated strengths, advantages, or pros.
                - title: Risk
                  copy: Use this section for risks, warnings, disadvantages, or cons that should not become wide table columns.
                - title: Next action
                  copy: Use this section for prompt notes, command notes, recommendation text, or review guidance.
        hard_rules:
            - five_tabs_minimum
            - first_tab_table
            - last_tab_json
            - rounded_tabs_with_icons
            - centered_rownum_column
            - centered_icon_only_action_column
