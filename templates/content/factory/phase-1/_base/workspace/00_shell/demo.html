<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Base Shell Demo</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <style>
        body {
            margin: 0;
            padding: 32px;
            background: #0f172a;
            color: #e5e7eb;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        .demo-title {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 0 0 18px;
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 0;
        }

        .demo-title-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 34px;
            height: 34px;
            border-radius: 10px;
            background: #1e293b;
            color: #38bdf8;
        }
    </style>
    <style>
        /* section.css */

        .base-demo-tool,
        .base-demo-tool *,
        .base-demo-tool *::before,
        .base-demo-tool *::after {
            box-sizing: border-box;
        }

        .base-demo-tool {
            --base-surface: #ffffff;
            --base-surface-muted: #f8fafc;
            --base-border: #dbe4ef;
            --base-border-strong: #cbd5e1;
            --base-text: #1f2937;
            --base-text-muted: #64748b;
            --base-heading: #111827;
            --base-accent: #2563eb;
            --base-focus-ring: rgba(37, 99, 235, 0.16);
            --base-radius-sm: 12px;
            --base-radius-md: 16px;
            --base-shadow-sm: 0 12px 28px rgba(15, 23, 42, 0.08);
            color: var(--base-text);
            font-size: 14px;
            line-height: 1.5;
        }

        .base-demo-tool .base-demo-workspace {
            display: grid;
            grid-template-columns: minmax(280px, 0.88fr) minmax(0, 1.42fr);
            gap: 18px;
            align-items: start;
            min-width: 0;
        }

        .base-demo-tool .base-demo-workspace-column,
        .base-demo-tool .base-demo-panel,
        .base-demo-tool .base-demo-panel-body,
        .base-demo-tool .base-demo-section-slot {
            min-width: 0;
        }

        .base-demo-tool .base-demo-workspace-column {
            display: grid;
            gap: 16px;
        }

        .base-demo-tool .base-demo-panel {
            overflow: hidden;
            border: 1px solid var(--base-border);
            border-radius: var(--base-radius-md);
            background: var(--base-surface);
            box-shadow: var(--base-shadow-sm);
        }

        .base-demo-tool .base-demo-panel-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 14px;
            padding: 16px 18px;
            border-bottom: 1px solid var(--base-border);
            background: linear-gradient(180deg, var(--base-surface) 0%, var(--base-surface-muted) 100%);
        }

        .base-demo-tool .base-demo-panel-title {
            margin: 0;
            color: var(--base-heading);
            font-size: 18px;
            font-weight: 800;
            letter-spacing: 0;
            line-height: 1.25;
        }

        .base-demo-tool .base-demo-panel-subtitle {
            margin: 6px 0 0;
            color: var(--base-text-muted);
            font-size: 13px;
            line-height: 1.5;
        }

        .base-demo-tool .base-demo-panel-body {
            display: grid;
            gap: 16px;
            padding: 18px;
        }

        .base-demo-tool .base-demo-surface-state {
            display: grid;
            gap: 4px;
            padding: 16px;
            border: 1px dashed var(--base-border-strong);
            border-radius: var(--base-radius-sm);
            background: var(--base-surface-muted);
            color: var(--base-text-muted);
        }

        .base-demo-tool .base-demo-surface-state strong {
            color: var(--base-heading);
            font-size: 14px;
            line-height: 1.4;
        }

        .base-demo-tool .base-demo-surface-state span {
            font-size: 13px;
            line-height: 1.5;
        }

        @media (max-width: 960px) {
            .base-demo-tool .base-demo-workspace {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <h1 class="demo-title">
        <span class="demo-title-icon"><i class="bi bi-layout-sidebar-inset" aria-hidden="true"></i></span>
        <span class="demo-title-text">Base Shell</span>
    </h1>

    <div class="base-demo-tool" data-tool-family-shell="base">
        <div class="base-demo-workspace" aria-label="Base shell workspace">
            <div class="base-demo-workspace-column base-demo-workspace-column-controls">
                <section class="base-demo-panel" aria-labelledby="baseDemoControlsTitle">
                    <div class="base-demo-panel-header">
                        <div>
                            <h2 class="base-demo-panel-title" id="baseDemoControlsTitle">Inputs</h2>
                            <p class="base-demo-panel-subtitle">Configure the model before generating output.</p>
                        </div>
                    </div>
                    <div class="base-demo-panel-body">
                        <div class="base-demo-section-slot" data-base-slot="controls"></div>
                    </div>
                </section>
            </div>

            <div class="base-demo-workspace-column base-demo-workspace-column-output">
                <section class="base-demo-panel" aria-labelledby="baseDemoOutputTitle">
                    <div class="base-demo-panel-header">
                        <div>
                            <h2 class="base-demo-panel-title" id="baseDemoOutputTitle">Output</h2>
                            <p class="base-demo-panel-subtitle">Review generated results, evidence, exports, or restore data.</p>
                        </div>
                    </div>
                    <div class="base-demo-panel-body">
                        <div class="base-demo-surface-state" data-state="empty">
                            <strong>Waiting for input</strong>
                            <span>Complete the required fields and run the primary action.</span>
                        </div>
                        <div class="base-demo-section-slot" data-base-slot="output"></div>
                    </div>
                </section>
            </div>
        </div>
    </div>
</body>
</html>
