<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Base JSON Restore Demo</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <style>
        body {
            margin: 0;
            background: #f8fafc;
            color: #111827;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        .demo-wrap {
            display: grid;
            gap: 18px;
            width: min(980px, calc(100% - 32px));
            margin: 32px auto;
        }

        .demo-title {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 0;
            color: #111827;
            font-size: 22px;
            line-height: 1.2;
        }

        .demo-title-icon {
            display: inline-flex;
            width: 34px;
            height: 34px;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            background: #ede9fe;
            color: #6d28d9;
        }

        .base-demo-tool {
            --base-json-border: #ddd6fe;
            --base-json-border-soft: #efe7ff;
            --base-json-border-strong: #c8b6ff;
            --base-json-head-bg: #f8f5ff;
            --base-json-empty-bg: #fffaf5;
            --base-json-surface: #ffffff;
            --base-json-text: #1f1733;
            --base-json-heading: #1f1433;
            --base-json-muted: #6b5b7e;
        }
    </style>
    <link rel="stylesheet" href="section.css">
</head>
<body>
    <main class="demo-wrap">
        <h1 class="demo-title">
            <span class="demo-title-icon"><i class="bi bi-braces" aria-hidden="true"></i></span>
            <span class="demo-title-text">Base JSON Restore Demo</span>
        </h1>

        <section class="base-demo-tool __TOOL_CLASS__">
            <div class="__PREFIX__-json-restore-shell" id="__DOM_PREFIX__JsonRestoreShell">
                <div class="__PREFIX__-json-card tool-json-panel" id="__DOM_PREFIX__JsonPanel" role="region" aria-label="Generated JSON and restore status">
                    <div class="__PREFIX__-json-head tool-json-head">
                        <div class="__PREFIX__-json-title-wrap">
                            <span class="__PREFIX__-json-title tool-json-title">JSON Output</span>
                            <span class="__PREFIX__-json-helper">Exported state should match the generated output and restore path.</span>
                        </div>
                        <span class="__PREFIX__-json-status is-hidden" id="__DOM_PREFIX__JsonRestoreStatus" role="status" aria-live="polite"></span>
                    </div>

                    <div class="__PREFIX__-json-empty is-hidden" id="__DOM_PREFIX__JsonRestoreEmpty">Generate output before exporting JSON.</div>
                    <pre class="__PREFIX__-json-output tool-json-output"><code id="__DOM_PREFIX__JsonOutput">{
  "schema": "infrastack.example.v1",
  "state": {
    "sort": "id",
    "updated": "now",
    "restorable": true
  }
}</code></pre>
                </div>

                <input type="file" id="__DOM_PREFIX__ImportJson" class="__PREFIX__-import-input d-none" accept="application/json">
            </div>
        </section>
    </main>
    <script src="section.js"></script>
</body>
</html>
