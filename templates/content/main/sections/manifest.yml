source: main-sections
version: 1.2.0
status: active
description: Canonical reusable content section delivery source for InfraStack tool scaffolding.
agent_map: templates/content/main/AGENTS.md

scaffold_path: templates/content/main/scaffold/
sections_path: templates/content/main/sections/

applies_to:
    - tool scaffolds
    - support content
    - markdown sections
    - card and content rhythm
    - future family baselines

content_sections:
    - 01_overview
    - 02_technical-details
    - 03_example-prompts
    - 04_tips-prompts
    - 05_how-to-use
    - 06_export-notes
    - 07_faq
    - 08_acronyms
    - 09_example-commands
    - 10_references
    - 11_glossary

generation_rules:
    - Use this scaffold as the shared content section source for all families.
    - Applying a section means applying the complete section contract: content.md markup, section.css visual behavior, and section.js helper behavior when present.
    - Final runtime packages do not automatically load source section.css files; required section styling must be copied or adapted into final tool custom.css unless a documented shared include exists.
    - Replace __PREFIX__, __TOOL_CLASS__, copy hook names, citation IDs, and labels with the final tool namespace.
    - Complete content delivery includes 01_overview, 02_technical-details, 04_tips-prompts, 05_how-to-use, 06_export-notes, 07_faq, and 10_references.
    - Use exactly one example section for the normal deliverable: 03_example-prompts for architecture-family, prompt-driven, and preset-brief examples; 09_example-commands for shell, command-generator, runbook, scanner, or assessment examples that are literal commands.
    - Do not include both prompt and command examples unless the final tool genuinely supports both workflows and the exception is recorded.
    - Use 08_acronyms only when abbreviations need a compact expansion table.
    - Use 11_glossary only when broader domain, command, or workflow terms need explanation.
    - Do not include both 08_acronyms and 11_glossary unless the final tool has a clear reviewed need for separate abbreviation and terminology references.
    - Use 10_references for complete factual content delivery, for support content with citations, or when the user requests references.
    - Every support section heading uses a left icon and a divider line below the title.
    - Technical Details keeps the main h2 title unnumbered, while every h3 subsection label visibly starts with 1., 2., 3., and so on, and uses separator lines between later numbered headings.
    - Prompt Tips, How To Use, and Export Notes accordion rows use left icon chips with clear spacing before the row text.
    - FAQ accordion rows stay text-only; FAQ uses an icon-led section title and explanatory paragraph.
    - How To Use, FAQ, and References include a short explanatory paragraph before the first accordion row or table.
    - Substantial Technical Details sections must be 1500+ words, cite at least two official or source-of-truth sources when making technical claims, and use paragraphs plus structured review aids such as bullets or tables when they clarify behavior.
    - Keep citations source-backed; no fabricated source metadata, unsupported claims, or random sources.
    - Use narrative in-text citations where practical, such as Author (Year) says, reports, frames, or describes.
    - Make in-text citations clickable and link them to matching References table row IDs.
    - Vary source types only when valid sources exist and directly support the cited sentence.
    - Keep prompt and command terminal strip titles centered and title case; do not force all-caps labels.
    - Do not duplicate sections/ folders inside family directories.
    - Family README.md and manifest.yml files describe family behavior and adaptation rules.
    - Family workspace/ folders own family-specific workspace sections, workspace grammar, and baseline reference selection.
    - Final runtime packages still live under templates/content/tools/<category>/<tool-slug>/.
    - Final runtime packages must own their local content.md, card.yml, meta.yml, tool.html.twig, custom.css, and custom.js.
    - Adapt visible copy, labels, controls, outputs, icons, examples, and score/result language to the family and domain.
    - Keep all generated CSS and JavaScript scoped to the final tool namespace.
    - Do not use main sections as hidden runtime dependencies unless a documented shared include system exists.
    - Do not mark a section as applied until the final tool package preserves the template content and visual contract.

validation_rules:
    - README.md exists at templates/content/main/scaffold/README.md.
    - manifest.yml exists at templates/content/main/sections/manifest.yml.
    - Required content section folders exist under templates/content/main/sections/content/.
    - 10_references contains README.md, content.md, demo.html, and section.css.
    - 11_glossary contains README.md, content.md, demo.html, and section.css.
    - Complete content delivery includes the mandatory section set unless an exception is recorded.
    - 03_example-prompts and 09_example-commands are mutually exclusive unless an exception is recorded.
    - 08_acronyms and 11_glossary are mutually exclusive unless an exception is recorded.
    - Substantial Technical Details content is 1500+ words.
    - Citation links and reference row IDs are paired when citations are generated.
    - Final content.md has the selected section namespace markers and no unresolved template placeholders.
    - Final custom.css has selectors for every applied section's required card frame, section title icon, heading divider, Technical Details subsection separator, required Prompt Tips, How To Use, and Export Notes row icons, typography, table, list, details, FAQ, copy-button, citation, prompt, or command behavior.
    - Final JavaScript has section helper hooks when an applied section ships section.js behavior.
    - Section-template parity is validated against the final runtime package, not only the source template.
    - Family directories do not contain duplicated sections/ folders.
    - Active family directories contain workspace/ sources when they define reusable workspace grammar.
    - References in AGENTS.md, codex/*.md, family README.md, and family manifest.yml point to this main sections path.
    - Prompt and command terminal strip titles render as centered title-case labels.
