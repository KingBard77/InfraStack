family: scanning
version: 1.0.6
status: active
description: Baseline template for InfraStack scanner tools with target input, bounded scan options, hidden-first result output, evidence tables, export controls, and JSON restore boundaries.
agent_map: templates/content/family/scanning/AGENTS.md

baseline_path: templates/content/family/scanning/
preferred_baseline_path: templates/content/family/scanning/
workspace_path: templates/content/family/scanning/workspace/
scaffold_path: templates/content/main/scaffold/
main_sections_path: templates/content/main/sections/

runtime_baseline:
    source_tool: templates/content/tools/security/scan-web-security/
    source_snapshot: templates/content/family/scanning/baseline/source/
    workspace_sections: templates/content/family/scanning/workspace/
    model_core: templates/content/family/scanning/workspace/assets/bin/model-core.js
    copy_mode: section_owned
    css_js_mode: section_owned
    model_core_sha256: 9846dafe6227ebb04bfc0021c826370fc747c371a6d2f264369d5dc599582073
    source_hashes:
        tool_html_twig: 9b2466749811fbd509b27d760e3f4b4c35733419d1fdc995e67a9c3843bfad84
        custom_css: b2ec94965596e728eb675604d387ab0d823b095421372e680dd7804950e216b8
        custom_js: 16620ae5a075b062f6a3083f662a8dc8ed7e8142e956497248c14f5dec2e9f2a
        model_core: 9846dafe6227ebb04bfc0021c826370fc747c371a6d2f264369d5dc599582073
    rule: Keep the full copied scanning source under baseline/source/ as a reference-only snapshot. Extract reusable scanning behavior into section-owned workspace files.

reference_tool:
    path: templates/content/tools/security/scan-web-security/
    purpose: Current working baseline reference for scanning-family composition. Use the workflow grammar and quality bar, not web-header-specific wording.
    aliases:
        - Web Security Scanner
        - Web security scanner
        - web-security-scanner
        - scan-web-security

applies_to:
    - public web scanners
    - header posture scanners
    - cookie posture scanners
    - TLS posture scanners
    - redirect scanners
    - public endpoint scanners
    - DNS and record scanners
    - lightweight evidence scanners
    - server-assisted scan tools

section_adaptation:
    content:
        01_overview: scanner purpose, target boundary, evidence boundary, and trust boundary
        02_technical-details: request model, validation boundary, probes, findings, and payload shape
        03_example-prompts: Example Scan Inputs with paired Copy input controls unless the scanner is prompt-driven
        09_example-commands: literal scanner commands with paired Copy command controls when the scanner is command-oriented
        example_terminal_title: centered title case
        04_tips-prompts: scan input tips, scope tips, or evidence interpretation guidance
        05_how-to-use: target, options, scan, review, export, and restore workflow
        06_export-notes: PDF or report, CSV, JSON, copy, and import restore boundaries
        07_faq: scanner scope boundaries and evidence limitations
        08_acronyms: optional abbreviation expansion table; scanner, protocol, and domain acronyms
        11_glossary: optional broader terminology table; broader domain, command, workflow, platform, or estimate terminology
        10_references: complete factual content delivery, valid source-backed citations, and References rows when final scanning content cites sources
    workspace:
        01_input-brief: primary target input and scan action
        02_basic-settings: request method, redirects, timeout, validation, client profile, and companion probes
        03_advanced-settings: optional advanced scan options; no-op unless a scanner separates them from basic options
        04_selected-item: optional selected finding/evidence inspector; no-op unless the scanner supports selection
        05_result-summary: hidden-first result shell, score/status, metrics, chips, and final target details
        06_result-view: findings, evidence tables, surface details, and result tabs
        07_table-export: ID-first sort, row copy, CSV/report/JSON, optional import, and output actions
        08_json-restore: scanner JSON payload output and optional restore handling

workspace_section_file_contract:
    required_per_section:
        - README.md
        - demo.html
        - page.html.twig
        - section.css
        - section.js
    role: Match the architecture family section bundle shape so each scanning workspace section has documentation, isolated demo markup, reusable Twig, scoped CSS, and scoped JavaScript.

required_output_files:
    - card.yml
    - content.md
    - custom.css
    - custom.js
    - meta.yml
    - tool.html.twig

optional_output_files:
    - assets/bin/model-core.js
    - assets/icon/
    - assets/img/post.html.twig
    - src/Controller/Tools/<Category>/<Tool>/CustomController.php

required_first_line_markers:
    content.md: "[//]: # (content.md)"
    card.yml: "# card.yml"
    custom.css: "/* custom.css */"
    custom.js: "// custom.js"
    meta.yml: "# meta.yml"
    tool.html.twig: "{# tool.html.twig #}"

workspace_flow:
    - target_input
    - scan_options
    - hidden_first_result_empty_state
    - result_summary
    - output_toolbar_sort_copy_export_import
    - result_tabs_evidence_tables
    - json_payload_output_restore

export_priority:
    - PDF_or_print_report
    - CSV
    - JSON
    - Import_JSON_restore_when_implemented

generation_rules:
    - Use this family template as the baseline for scanning tools.
    - Use scan as the family verb for new scanning tool identities.
    - Use scan-prefixed names for scanning family outputs.
    - Generate the final runtime package under templates/content/tools/<category>/<tool-slug>/.
    - Do not use the family directory as the final runtime package.
    - Do not omit tool-local files because the family source exists.
    - Keep full copied scanning source under baseline/source/ as a reference-only snapshot when refreshing this baseline.
    - Keep reusable scanning workspace behavior in section-owned page.html.twig, section.css, section.js, and demo.html files.
    - Keep workspace/assets/bin/model-core.js as the reusable model-core source when the source tool ships one.
    - Use Web Security Scanner as the current working baseline reference for scanning workspace grammar.
    - Mirror the stabilized scanning output shell with hidden-first empty state, result summary, toolbar shell, tabs shell, table shell, and JSON panel.
    - Keep the compact circular score ring with centered score and denominator text.
    - Keep custom preference controls inside the scanner shell without nested card framing unless a separate inspector section is justified.
    - Keep summary, toolbar, tabs, and table shells visually separated without unintended divider lines between them.
    - Default sortable finding output to ID when stable row order exists.
    - Keep result table copy columns sticky or frozen when horizontal scrolling is needed.
    - Keep output action buttons compact and boxed, not oversized pills.
    - Keep dropdown menus visible above adjacent cards.
    - Use Example Scan Inputs with paired Copy input controls for form-first scanners.
    - Keep generic markdown copy buttons out of those paired example controls.
    - Do not copy web-header-specific language into unrelated scanners.
    - Apply category/provider token lineage, restrained visual weight, and tool-specific namespace.
    - Keep CSS and JavaScript scoped to the final tool.
    - Keep content domain-native and aligned with actual behavior.
    - Use family workspace source from templates/content/family/scanning/workspace/.
    - Use shared content section source from templates/content/main/sections/content/.
    - Apply shared main content sections as a full contract: content.md markup, section.css visual behavior, and section.js helper behavior when present.
    - Final tool custom.css and custom.js must preserve the applied section card frame, heading divider, typography, table, list, details, FAQ, copy, citation, prompt, or command behavior unless a documented shared include exists.
    - Use 10_references for complete factual content delivery and when final content includes valid source-backed citations, with in-text citation links targeting matching References row IDs.
    - Do not create a family-local sections/ directory.

validation_rules:
    - README.md exists.
    - manifest.yml exists.
    - workspace/README.md exists.
    - workspace/manifest.yml exists.
    - Shared main content section source exists under templates/content/main/sections/content/.
    - Applied shared content sections are validated in the final tool package for namespace markers, unresolved placeholders, required custom.css selectors, and helper hooks when used.
    - Citation links and References rows are paired when 10_references is used.
    - Scanning workspace section folders exist under templates/content/family/scanning/workspace/.
    - Each scanning workspace section folder contains README.md, demo.html, page.html.twig, section.css, and section.js.
    - baseline/source/tool.html.twig, baseline/source/custom.css, baseline/source/custom.js, and baseline/source/assets/bin/model-core.js exist.
    - root workspace/custom.css and workspace/custom.js do not exist.
    - workspace/assets/bin/model-core.js exists and matches the declared reusable model-core hash.
    - No duplicated scanning sections/ directory exists under templates/content/family/scanning/.
    - Required final output files are created in the final tool package.
    - Required first-line markers are present.
    - Tool namespace is unique.
    - CSS is scoped under the tool root.
    - JavaScript DOM references match Twig IDs.
    - Scan query, result summary, tables, exports, and JSON use one normalized model or payload.
    - Export controls match implemented exports.
    - Import controls appear only when JSON restore is implemented and validated.
    - Result table is hidden on first refresh unless validated restore intentionally loads output.
    - Example Scan Input copy controls target the matching input block without duplicate generic copy buttons.
    - Content does not claim compliance, security certification, exploitability, production readiness, or full coverage unless validated.
