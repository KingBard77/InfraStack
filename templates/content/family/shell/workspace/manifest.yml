source: shell-family-workspace
family: shell
version: 1.0.0
status: active
description: Family-specific workspace grammar for InfraStack shell and command-generation tools using the promoted shell family baseline.
baseline_snapshot: "2026-05-18"
agent_map: templates/content/family/shell/FAMILY.md

family_path: templates/content/family/shell/
workspace_path: templates/content/family/shell/workspace/
scaffold_path: templates/content/main/scaffold/
main_sections_path: templates/content/main/sections/

reference_workspace:
    title: Netcat Command Generator
    path: templates/content/tools/shell/generate-netcat-shell/
    aliases:
        - Netcat Command Generator
        - netcat command generator
        - generate-netcat-shell
        - generate_netcat_shell
    role: Historical working reference for shell workspace grammar before baseline promotion.

runtime_baseline:
    source_tool: templates/content/tools/shell/generate-netcat-shell/
    source_snapshot: templates/content/family/shell/baseline/source/
    source_of_truth: templates/content/family/shell/workspace/
    workspace_sections: templates/content/family/shell/workspace/
    model_core: templates/content/family/shell/workspace/assets/bin/model-core.js
    copy_mode: section_owned
    css_js_mode: section_owned_extracted
    root_runtime_snapshots: false
    source_marker_mode: baseline_snapshot_marker_anchored
    source_markers:
        syntax: "source:start/source:end family.shell.workspace.<section>"
        path: templates/content/family/shell/baseline/source/
        files:
            - tool.html.twig
            - custom.css
            - custom.js
    extracted_runtime_sources:
        css:
            shared_foundation: repeated minimal section demo foundation only
            section_specific: workspace section.css owns the CSS needed by its section
            forbidden: full custom.css copies inside section folders
        js:
            source_ownership_maps: workspace section.js records section-specific custom.js line ranges, DOM IDs, classes, variables, functions, and behaviors
            forbidden: full custom.js runtime strings inside section folders
    model_core_sha256: 5c4e56b1f1585e9c6b26ebde6685f1dcedeb2be998a08d5fa06ab6520ced9427
    source_hashes:
        tool_html_twig: 0ba0786819606fc0f28708709454b74125201d33df41566dc051a4e53be9fb82
        custom_css: 1d75a1962974a92c60dbf5dc89ef4d5931ccec00c8d053d307188988982fe000
        custom_js: 0b2bc9ed0b725ae1eb8dd10dbb466a165ff6597ac08e2819ce736d2b787b7571
        model_core: 5c4e56b1f1585e9c6b26ebde6685f1dcedeb2be998a08d5fa06ab6520ced9427

selection_triggers:
    - shell
    - command
    - CLI
    - terminal
    - one-liner
    - script
    - command generator
    - command validator
    - command explainer

workspace_flow:
    - input_target
    - basic_setting
    - advanced_setting
    - result_text
    - score_card
    - sort_card
    - table_warnings_json_restore

workspace_sections:
    01_input-target: primary command target, command intent entry point, and generate/reset actions
    02_basic-setting: implementation, shell, role, target, operands, ports, and required command fields
    03_advanced-setting: custom panel for protocol, lookup, timeout, source, payload, proxy, TLS, advanced flags, and raw extras
    04_result-text: generated command text, copy control, empty state, and before/after result text demos
    05_score-card: result summary, score/status cards, badges, and command route summary
    06_sort-card: ID-first sort controls, output toolbar, copy/export actions, and compact action grouping
    07_table: operation rows, row copy actions, warnings, errors, JSON output, and restore import boundary when implemented

section_file_contract:
    required_per_section:
        - README.md
        - demo.html
        - page.html.twig
        - section.css
        - section.js
    role: Keep shell workspace sections structurally equivalent to architecture workspace sections while preserving command-builder behavior.

baseline_rules:
    command_execution:
        browser_execution: forbidden
        execution_handlers: warn_or_block_when_risky
    output:
        sort_default: id
        row_copy: icon_only
        stable_row_ids_after_sort: true
        before_after_demo_layout: vertical_stack
        tabs:
            - Command
            - Operations
            - Warnings
            - JSON
        operation_table_columns:
            - "#"
            - Field
            - Value
            - Action
    json:
        output: normalized_command_payload
        restore_import: only_when_implemented_and_validated
    content:
        example_commands: literal_commands_with_command_use_notes
        tips: command_builder_or_input_guidance
        acronyms: cli_shell_protocol_platform_terms

scaffold_content_adaptation:
    01_overview: shell command purpose, input boundary, and output boundary
    02_technical-details: command parser, token order, support matrix, warnings, and payload structure
    03_example-prompts: natural-language command brief examples only when the tool supports a prompt workflow
    09_example-commands: Example Commands for literal commands with paired Copy command controls and centered title-case terminal titles
    04_tips-prompts: command-builder, option, or input tips
    05_how-to-use: build, inspect, sort, copy, export, and restore workflow
    06_export-notes: command copy, PDF/report, CSV, JSON, and restore boundaries
    07_faq: execution, platform differences, safety boundaries, and trust limits
    08_acronyms: optional abbreviation expansion table; CLI, shell, command, protocol, and platform acronyms
    11_glossary: optional broader terminology table; broader domain, command, workflow, platform, or estimate terminology
    10_references: complete factual content delivery, valid source-backed citations, and References rows when final shell content cites sources

state_contract:
    - preset
    - implementation_or_command_flavor
    - shell_target
    - command_role
    - operands
    - options
    - generated_tokens
    - command_string
    - warnings
    - blocking_errors
    - summary_rows
    - exports
    - json_output
    - json_restore_when_implemented

generation_rules:
    - Select this workspace source for shell-family tool requests.
    - Keep full copied shell source under baseline/source/ as a reference-only snapshot when refreshing this baseline.
    - Regenerate page.html.twig and section.css from source:start/source:end family.shell.workspace.<section> ranges in the baseline/source snapshot.
    - Replace exact source identifiers with __TOOL_CLASS__, __PREFIX__, and __DOM_PREFIX__ placeholders; never use a broad substring replacement that corrupts generate-netcat-shell-toolbar into a root-class placeholder fragment.
    - Keep reusable shell workspace behavior in section-owned page.html.twig, section.css, section.js, and demo.html files.
    - Reapplying this workspace source to existing shell runtime packages requires structural, visual, and runtime parity with these section sources, not marker coverage.
    - Apply all seven shell workspace sections to every shell runtime package in scope, including generate-netcat-shell when named.
    - Preserve only command-native labels, operands, option logic, warning rules, stable DOM IDs needed by existing behavior, and exported JSON schema compatibility.
    - Use the seven shell workspace sections 01_input-target, 02_basic-setting, 03_advanced-setting, 04_result-text, 05_score-card, 06_sort-card, and 07_table.
    - Stack before and after states vertically as two rows in one column in result-related family demos.
    - Keep section.css extracted to the relevant custom.css selectors plus the repeated minimal shell demo foundation, matching the architecture family pattern.
    - Keep section.js extracted to source ownership maps; do not embed the full custom.js runtime in section.js strings.
    - Keep workspace/assets/bin/model-core.js as the reusable model-core source when the source tool ships one.
    - Use shared main content sections for reusable content rhythm.
    - Apply shared main content sections as a full contract: content.md markup, section.css visual behavior, and section.js helper behavior when present.
    - Final tool custom.css and custom.js must preserve the applied section card frame, section title icon, heading divider, Technical Details subsection separator, row icon, typography, table, list, details, FAQ, copy, citation, prompt, or command behavior unless a documented shared include exists.
    - Shell support section headings use a left icon and divider line.
    - Command Tips, How To Use, and FAQ accordion rows use compact left icon chips.
    - How To Use and FAQ include a short explanatory paragraph before the first accordion row.
    - Use 10_references for complete factual content delivery and when final content includes valid source-backed citations, with in-text citation links targeting matching References row IDs.
    - Do not create a family-local sections/ directory.
    - Do not copy netcat-specific flags, examples, or warnings into unrelated shell tools.
    - Preserve shell-family command-builder grammar while adapting labels, category/provider tokens, command semantics, examples, and export behavior.
    - Generate final runtime files under templates/content/tools/<category>/<tool-slug>/.

validation_rules:
    - workspace/README.md exists.
    - workspace/manifest.yml exists.
    - reference workspace path exists when used.
    - shell workspace section folders exist.
    - every shell workspace section folder contains README.md, demo.html, page.html.twig, section.css, and section.js.
    - baseline/source/tool.html.twig, baseline/source/custom.css, baseline/source/custom.js, and baseline/source/assets/bin/model-core.js exist.
    - root workspace/custom.css and workspace/custom.js do not exist.
    - workspace/assets/bin/model-core.js exists and matches the declared reusable model-core hash.
    - shared main content section source exists.
    - Applied shared content sections are validated in the final tool package for namespace markers, unresolved placeholders, required custom.css selectors, and helper hooks when used.
    - Applied shell workspace sections are validated in the final tool package for structural, visual, and runtime parity with the family source; namespace markers alone are insufficient.
    - citation links and References rows are paired when 10_references is used.
    - no family-local sections/ directory exists.
    - final tool command, warnings, table rows, exports, and JSON use one normalized model.
