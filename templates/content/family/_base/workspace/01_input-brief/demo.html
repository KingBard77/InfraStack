<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Base Input Brief Demo</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <style>
        body {
            margin: 0;
            background: #f8fafc;
            color: #111827;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        .demo-wrap {
            display: grid;
            gap: 20px;
            width: min(980px, calc(100% - 32px));
            margin: 32px auto;
        }

        .demo-title {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 0;
            color: #111827;
            font-size: 22px;
            line-height: 1.2;
        }

        .demo-title-icon {
            display: inline-flex;
            width: 34px;
            height: 34px;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            background: #e2e8f0;
            color: #334155;
        }

        .base-demo-tool {
            --base-surface: #ffffff;
            --base-border: #dbe4ef;
            --base-text: #1f2937;
            --base-text-muted: #64748b;
            --base-heading: #111827;
            --base-accent: #2563eb;
            --base-accent-soft: rgba(37, 99, 235, 0.1);
            --base-accent-border: rgba(37, 99, 235, 0.28);
            --base-focus-ring: rgba(37, 99, 235, 0.16);
            --base-radius-sm: 14px;
            --base-radius-md: 22px;
            --base-shadow-sm: 0 12px 28px rgba(15, 23, 42, 0.08);
            width: 100%;
            max-width: 920px;
            margin: 0 auto;
            color: var(--base-text);
        }

        .base-demo-tool .base-demo-input-card {
            min-width: 0;
            padding: 28px;
            border: 1px solid var(--base-border);
            border-radius: var(--base-radius-md);
            background: var(--base-surface);
            box-shadow: var(--base-shadow-sm);
        }

        .base-demo-tool .base-demo-input-brief {
            display: grid;
            gap: 14px;
            min-width: 0;
        }

        .base-demo-tool .base-demo-input-row {
            display: grid;
            grid-template-columns: minmax(130px, 0.28fr) minmax(0, 1fr);
            gap: 14px;
            align-items: start;
            min-width: 0;
            order: 1;
        }

        .base-demo-tool .base-demo-input-label-wrap {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
        }

        .base-demo-tool .base-demo-input-label {
            margin: 0;
            color: var(--base-heading);
            font-size: 20px;
            font-weight: 800;
            line-height: 1.3;
        }

        .base-demo-tool .base-demo-helper-chip {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex: 0 0 auto;
            width: 26px;
            height: 26px;
            border: 1px solid var(--base-accent-border);
            border-radius: 999px;
            background: var(--base-accent-soft);
            color: var(--base-accent);
            font-size: 13px;
            font-weight: 800;
            line-height: 1;
        }

        .base-demo-tool .base-demo-input-stack {
            display: grid;
            gap: 8px;
            min-width: 0;
        }

        .base-demo-tool .base-demo-input-control {
            width: 100%;
            min-height: 118px;
            padding: 12px 14px;
            border: 1px solid var(--base-border);
            border-radius: var(--base-radius-sm);
            background: #ffffff;
            color: var(--base-text);
            box-shadow: none;
            resize: vertical;
        }

        .base-demo-tool .base-demo-input-control:focus {
            border-color: var(--base-accent);
            box-shadow: 0 0 0 3px var(--base-focus-ring);
            outline: none;
        }

        .base-demo-tool .base-demo-input-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            justify-content: flex-end;
            min-width: 0;
            order: 3;
        }

        .base-demo-tool .base-demo-action-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            min-height: 54px;
            max-width: 100%;
            padding: 0 24px;
            border: 1px solid transparent;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 800;
            line-height: 1.2;
            text-align: center;
            white-space: normal;
        }

        .base-demo-tool .base-demo-action-btn-primary {
            border-color: var(--base-accent);
            background: var(--base-accent);
            color: #ffffff;
        }

        .base-demo-tool .base-demo-action-btn-secondary {
            border-color: var(--base-border);
            background: #ffffff;
            color: var(--base-heading);
        }

        .base-demo-tool .base-demo-input-helper-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            min-width: 0;
            padding: 14px 16px;
            border: 1px dashed var(--base-accent-border);
            border-radius: var(--base-radius-sm);
            background: var(--base-accent-soft);
            order: 2;
        }

        .base-demo-tool .base-demo-input-hint {
            flex: 1 1 auto;
            min-width: 0;
            margin: 0;
            color: var(--base-text-muted);
            font-size: 14px;
            line-height: 1.5;
        }

        .base-demo-tool .base-demo-helper-chip-inline {
            width: 28px;
            height: 28px;
        }

        .base-demo-tool .base-demo-input-brief[data-input-layout="inline"] .base-demo-input-stack {
            grid-template-columns: minmax(0, 1fr);
        }

        .base-demo-tool .base-demo-input-brief[data-input-layout="stacked"] {
            grid-template-columns: minmax(130px, 0.28fr) minmax(0, 1fr);
        }

        .base-demo-tool .base-demo-input-brief[data-input-layout="stacked"] .base-demo-input-row {
            grid-column: 1 / -1;
        }

        .base-demo-tool .base-demo-input-brief[data-input-layout="stacked"] .base-demo-input-helper-card,
        .base-demo-tool .base-demo-input-brief[data-input-layout="stacked"] .base-demo-input-actions {
            grid-column: 2 / -1;
        }

        @media (max-width: 760px) {
            .base-demo-tool .base-demo-input-row,
            .base-demo-tool .base-demo-input-brief[data-input-layout="stacked"] {
                grid-template-columns: 1fr;
            }

            .base-demo-tool .base-demo-input-brief[data-input-layout="stacked"] .base-demo-input-row,
            .base-demo-tool .base-demo-input-brief[data-input-layout="stacked"] .base-demo-input-helper-card,
            .base-demo-tool .base-demo-input-brief[data-input-layout="stacked"] .base-demo-input-actions {
                grid-column: 1 / -1;
            }

            .base-demo-tool .base-demo-input-actions {
                justify-content: stretch;
            }

            .base-demo-tool .base-demo-action-btn {
                flex: 1 1 160px;
            }
        }
    </style>
</head>
<body>
    <div class="demo-wrap">
        <h1 class="demo-title">
            <span class="demo-title-icon"><i class="bi bi-input-cursor-text" aria-hidden="true"></i></span>
            <span class="demo-title-text">Base Input Brief</span>
        </h1>

        <div class="base-demo-tool">
            <div class="base-demo-input-card">
                <div class="base-demo-input-brief" data-input-layout="stacked">
                    <div class="base-demo-input-row">
                        <div class="base-demo-input-label-wrap">
                            <label for="baseDemoInput" class="base-demo-input-label">Primary input</label>
                            <span class="base-demo-helper-chip" title="Explain the expected input boundary" aria-label="Explain the expected input boundary">i</span>
                        </div>
                        <div class="base-demo-input-stack">
                            <textarea id="baseDemoInput" class="base-demo-input-control" rows="4">Describe the model, target, scenario, or request that should seed this workspace.</textarea>
                        </div>
                    </div>

                    <div class="base-demo-input-actions">
                        <button type="button" class="base-demo-action-btn base-demo-action-btn-primary">
                            <i class="bi bi-play-fill" aria-hidden="true"></i>
                            <span>Run</span>
                        </button>
                        <button type="button" class="base-demo-action-btn base-demo-action-btn-secondary">
                            <i class="bi bi-arrow-counterclockwise" aria-hidden="true"></i>
                            <span>Reset</span>
                        </button>
                    </div>

                    <div class="base-demo-input-helper-card">
                        <span class="base-demo-input-hint">The applied family preference chooses the final label, layout, icon, action text, and helper copy.</span>
                        <span class="base-demo-helper-chip base-demo-helper-chip-inline" title="Preference-driven input" aria-label="Preference-driven input">i</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
