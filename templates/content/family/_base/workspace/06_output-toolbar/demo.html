<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Base Output Toolbar Demo</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <style>
        body {
            margin: 0;
            background: #f8fafc;
            color: #111827;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        .demo-wrap {
            display: grid;
            gap: 18px;
            width: min(980px, calc(100% - 32px));
            margin: 32px auto;
        }

        .demo-title {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 0;
            color: #111827;
            font-size: 22px;
            line-height: 1.2;
        }

        .demo-title-icon {
            display: inline-flex;
            width: 34px;
            height: 34px;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            background: #ede9fe;
            color: #6d28d9;
        }

        .base-demo-tool {
            --base-output-border: #ddd6fe;
            --base-output-border-strong: #c8b6ff;
            --base-output-surface: #ffffff;
            --base-output-control-bg: #ffffff;
            --base-output-text: #1f1733;
            --base-output-muted: #6b5b7e;
            --base-output-accent: #ea580c;
            --base-output-accent-soft: #fff7ed;
            --base-output-accent-border: #fed7aa;
            --base-output-accent-ring: rgba(249, 115, 22, 0.12);
            --base-output-icon: #31264a;
        }

        .demo-card {
            min-height: 160px;
            padding: 18px;
            border: 1px solid #ddd6fe;
            border-radius: 12px;
            background: #ffffff;
            color: #64748b;
            font-size: 14px;
            font-weight: 700;
        }
    </style>
    <link rel="stylesheet" href="section.css">
</head>
<body>
    <main class="demo-wrap">
        <h1 class="demo-title">
            <span class="demo-title-icon"><i class="bi bi-layout-three-columns" aria-hidden="true"></i></span>
            <span class="demo-title-text">Base Output Toolbar Demo</span>
        </h1>

        <section class="base-demo-tool __TOOL_CLASS__">
            <div class="__PREFIX__-toolbar-shell">
                <div class="__PREFIX__-toolbar tool-output-toolbar">
                    <div class="__PREFIX__-toolbar-main">
                        <label for="__DOM_PREFIX__Sort" class="__PREFIX__-sort-label">Sort</label>
                        <div class="__PREFIX__-sort-wrap">
                            <details class="__PREFIX__-sort-select" id="__DOM_PREFIX__SortSelect" open>
                                <summary class="__PREFIX__-sort-summary" aria-haspopup="listbox" aria-expanded="true" aria-controls="__DOM_PREFIX__SortMenu">
                                    <span id="__DOM_PREFIX__SortSummary">ID</span>
                                </summary>

                                <div class="__PREFIX__-sort-menu" id="__DOM_PREFIX__SortMenu" role="listbox">
                                    <div class="__PREFIX__-sort-grid">
                                        <button type="button" class="__PREFIX__-sort-option is-active" data-sort-value="id" aria-pressed="true" role="option">ID</button>
                                        <button type="button" class="__PREFIX__-sort-option" data-sort-value="alphabetical" aria-pressed="false" role="option">A-Z</button>
                                        <button type="button" class="__PREFIX__-sort-option" data-sort-value="component" aria-pressed="false" role="option">Component</button>
                                        <button type="button" class="__PREFIX__-sort-option" data-sort-value="placement" aria-pressed="false" role="option">Placement</button>
                                        <button type="button" class="__PREFIX__-sort-option" data-sort-value="purpose" aria-pressed="false" role="option">Purpose</button>
                                    </div>
                                </div>
                            </details>
                            <input type="hidden" id="__DOM_PREFIX__Sort" value="id">
                        </div>
                    </div>

                    <div class="tool-output-actions __PREFIX__-toolbar-actions">
                        <button type="button" class="tool-action-btn tool-action-btn-secondary __PREFIX__-action-btn" id="__DOM_PREFIX__ExportPng">
                            <i class="bi bi-image" aria-hidden="true"></i>
                            <span data-button-label>Export PNG</span>
                        </button>
                        <button type="button" class="tool-action-btn tool-action-btn-secondary __PREFIX__-action-btn" id="__DOM_PREFIX__DownloadSvg">
                            <i class="bi bi-download" aria-hidden="true"></i>
                            <span data-button-label>Download SVG</span>
                        </button>
                        <button type="button" class="tool-action-btn tool-action-btn-secondary __PREFIX__-action-btn" id="__DOM_PREFIX__CopyJson">
                            <i class="bi bi-clipboard" aria-hidden="true"></i>
                            <span data-button-label>Copy JSON</span>
                        </button>
                        <button type="button" class="tool-action-btn tool-action-btn-secondary __PREFIX__-action-btn" id="__DOM_PREFIX__DownloadJson">
                            <i class="bi bi-download" aria-hidden="true"></i>
                            <span data-button-label>Download JSON</span>
                        </button>
                        <button type="button" class="tool-action-btn tool-action-btn-secondary __PREFIX__-action-btn" id="__DOM_PREFIX__ImportJsonButton">
                            <i class="bi bi-upload" aria-hidden="true"></i>
                            <span data-button-label>Import JSON</span>
                        </button>
                    </div>
                </div>
            </div>
        </section>

        <section class="demo-card">Following cards should stay visually below the open sort menu.</section>
    </main>
    <script src="section.js"></script>
</body>
</html>
