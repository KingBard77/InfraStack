json_restore_selection:
    source_section: 08_json-restore
    canonical_source_only: true
    compatibility_sections:
        - 07_table
        - 08_json-restore
        - 09_result-table
    selection_order:
        - explicit_user_family
        - existing_tool_family_metadata
        - dominant_behavior
        - category_fallback
        - generic_default
    category_fallbacks:
        cloud: architecture
        security: scanning
        cis: assessment
        shell: shell
    rule: Use the matching preference to fill JSON labels, helper copy, empty text, and import accept type. Do not duplicate the base section for each family.

json_restore_preferences:
    generic:
        aria_label: Generated JSON and restore state
        title: JSON Output
        helper: Exported state should match the generated output and restore path.
        empty_text: Generate output before exporting JSON.
        accept: application/json
        hard_rules:
            - framed_json_output
            - scoped_import_input
            - validate_before_restore
    architecture:
        aria_label: Architecture JSON model and restore state
        title: JSON Output
        helper: Exported model state should include diagram components, layout edits, selected items, and output data.
        empty_text: Generate a diagram before exporting architecture JSON.
        accept: application/json
        hard_rules:
            - model_state_required
            - layout_overrides_preserved
            - validate_before_restore
    calculate:
        aria_label: Estimate JSON output and restore state
        title: JSON Output
        helper: Exported estimate state should include inputs, assumptions, line items, totals, and generated output.
        empty_text: Build an estimate before exporting JSON.
        accept: application/json
        hard_rules:
            - assumptions_required
            - totals_match_payload
            - validate_before_restore
    scanning:
        aria_label: Scanner JSON evidence and restore state
        title: JSON Output
        helper: Exported scan state should include target, options, evidence, findings, and generated output.
        empty_text: Run a scan before exporting JSON.
        accept: application/json
        hard_rules:
            - target_required
            - evidence_preserved
            - validate_before_restore
    shell:
        aria_label: Command JSON output and restore state
        title: JSON Output
        helper: Exported command state should include target, options, generated command, warnings, and output rows.
        empty_text: Generate a command before exporting JSON.
        accept: application/json
        hard_rules:
            - command_state_required
            - warnings_preserved
            - validate_before_restore
    assessment:
        aria_label: Assessment JSON output and restore state
        title: JSON Output
        helper: Exported assessment state should include filters, selected control, visible rows, and generated output.
        empty_text: Explore controls before exporting JSON.
        accept: application/json
        hard_rules:
            - filters_required
            - selected_control_preserved
            - validate_before_restore
