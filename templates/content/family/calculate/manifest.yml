family: calculate
version: 1.4.0
status: active
description: Baseline template for InfraStack browser-first calculator tools using the AWS, Azure, and IBM Cloud cost calculators as the current reference set for structure, provider adaptation, category/provider token handling, normalized models, table export shells, and JSON restore boundaries.
agent_map: templates/content/family/calculate/AGENTS.md

baseline_path: templates/content/family/calculate/
preferred_baseline_path: templates/content/family/calculate/
workspace_path: templates/content/family/calculate/workspace/
scaffold_path: templates/content/main/scaffold/
main_sections_path: templates/content/main/sections/

section_runtime_baseline:
    source_tools:
        - path: templates/content/tools/aws/calculate-cost-aws/
          role: primary structural reference for workspace rhythm, output toolbar, result tabs, JSON restore, and support-content pattern
        - path: templates/content/tools/azure/calculate-cost-azure/
          role: provider-adaptation reference for Azure service names, category/provider tokens, chart palette replacement, and copied-token cleanup
        - path: templates/content/tools/ibm/calculate-cost-ibm/
          role: provider-adaptation reference for IBM Cloud service names, category/provider tokens, chart palette replacement, and copied-token cleanup
    source_snapshot: templates/content/family/calculate/baseline/source/
    purpose: Section-owned files are the reusable baseline. The source snapshot is reference-only. AWS supplies the structural reference while Azure and IBM Cloud prove provider adaptation, category/provider token handling, and copied-token cleanup.

runtime_baseline:
    source_tool: templates/content/tools/aws/calculate-cost-aws/
    source_snapshot: templates/content/family/calculate/baseline/source/
    workspace_sections: templates/content/family/calculate/workspace/
    copy_mode: section_owned
    source_hashes:
        tool_html_twig: bd204d9469580503ca6350a65c9f05eaecda415db972dbb6b19cea9999c179d8
        custom_css: 1644c71c96b9c9bd0c519347cc1a474bb374ee3a80c3b91993e1b61ba756c200
        custom_js: ab9dcdab32504d365194865e9c5f169e1adbbc3f4f2347619aa6b81197037db8
    rule: Keep the full copied calculate source under baseline/source/ as a reference-only snapshot. Do not keep root workspace custom.css, custom.js, or demo.html.twig files. Extract stabilized runtime structure into section-owned page.html.twig, section.css, section.js, and demo.html files.

reference_tools:
    - path: templates/content/tools/aws/calculate-cost-aws/
      title: AWS Cost Calculator
      role: structural_runtime_seed
      css_sha256: 1644c71c96b9c9bd0c519347cc1a474bb374ee3a80c3b91993e1b61ba756c200
      js_sha256: ab9dcdab32504d365194865e9c5f169e1adbbc3f4f2347619aa6b81197037db8
      aliases:
          - AWS Cost Calculator
          - AWS cost calculator
          - aws-cost-calculator
          - calculate-cost-aws
    - path: templates/content/tools/azure/calculate-cost-azure/
      title: Azure Cost Calculator
      role: provider_adaptation_reference
      css_sha256: e488d0c5dd5f7494e0b48cb4466c1d60fb12a513c94befe6106a519bf1c31528
      js_sha256: 1fe8b262e7df70550b2045ce6af9c78439d0e68bb2ac45bc979c72a433cd47ca
      aliases:
          - Azure Cost Calculator
          - Azure cost calculator
          - calculate-cost-azure
    - path: templates/content/tools/ibm/calculate-cost-ibm/
      title: IBM Cloud Cost Calculator
      role: provider_adaptation_reference
      css_sha256: 86db19a3aed5d182365910cc0c1ad54483c153bfef306bf3a9da6305299e11c4
      js_sha256: cbda4574ceadc30f335fbd00c84f16313103c06408f38847bbeae87374c633d9
      aliases:
          - IBM Cloud Cost Calculator
          - IBM cost calculator
          - IBM Cloud cost calculator
          - calculate-cost-ibm

applies_to:
    - cost calculators
    - pricing estimators
    - capacity calculators
    - sizing calculators
    - storage calculators
    - network calculators
    - budget calculators
    - run-rate estimators
    - service mix estimators
    - assumption-driven planning tools

section_adaptation:
    content:
        01_overview: calculator overview and estimate boundary
        02_technical-details: normalized inputs, assumptions, rates, and formulas
        03_example-prompts: preset-aligned example prompts or estimate briefs with Copy prompt controls
        example_terminal_title: centered title case
        04_tips-prompts: input tips and assumption guidance
        05_how-to-use: estimate workflow
        06_export-notes: PDF, CSV, JSON, copy, and import restore boundaries
        07_faq: calculator trust boundaries
        08_acronyms: optional abbreviation expansion table; domain and pricing acronyms
        11_glossary: optional broader terminology table; broader domain, command, workflow, platform, or estimate terminology
        10_references: complete factual content delivery, valid source-backed citations, and References rows when final calculate content cites sources
    workspace:
        01_input-brief: estimate label, scenario, or brief input and estimate/reset actions
        02_basic-settings: preset and required estimate settings
        03_advanced-settings: component/service cards, rates, quantities, assumptions, overrides, and buffers
        04_selected-item: optional selected line item or component inspector; no-op unless a calculator supports selection
        05_result-summary: two-column result overview, primary answer card, metrics, chips, and top drivers
        06_result-view: breakdown, service mix, assumptions, methodology, recommendations, and result tabs
        07_table-export: ID-first line-item sort, row copy actions, CSV, report, JSON, and optional import controls
        08_json-restore: calculator JSON payload output and optional restore handling

workspace_section_file_contract:
    required_per_section:
        - README.md
        - demo.html
        - page.html.twig
        - section.css
        - section.js
    role: Match the architecture family section bundle shape so each calculate workspace section has documentation, isolated demo markup, reusable Twig, scoped CSS, and scoped JavaScript.

required_output_files:
    - card.yml
    - content.md
    - custom.css
    - custom.js
    - meta.yml
    - tool.html.twig

optional_output_files:
    - assets/bin/model-core.js
    - assets/icon/
    - assets/img/post.html.twig

required_first_line_markers:
    content.md: "[//]: # (content.md)"
    card.yml: "# card.yml"
    custom.css: "/* custom.css */"
    custom.js: "// custom.js"
    meta.yml: "# meta.yml"
    tool.html.twig: "{# tool.html.twig #}"

workspace_flow:
    - estimate_label_or_scenario
    - preset_or_basic_settings
    - service_or_component_cards
    - advanced_assumptions_rates_overrides
    - result_summary
    - output_toolbar_sort_copy_export_import
    - result_tabs_table_shell
    - json_payload_output_restore

export_priority:
    - PDF_or_print_report
    - CSV
    - JSON
    - Import_JSON_restore_when_implemented

generation_rules:
    - Use this family template as the baseline for calculate tools.
    - Use calculate as the family verb for new calculate tool identities.
    - Use calculate-prefixed names for calculate family outputs.
    - Generate the final runtime package under templates/content/tools/<category>/<tool-slug>/.
    - Do not use the family directory as the final runtime package.
    - Do not omit tool-local files because the family source exists.
    - Keep full copied calculate source under baseline/source/ as a reference-only snapshot when refreshing this baseline.
    - Use AWS Cost Calculator as the structural reference and Azure plus IBM Cloud as provider-adaptation references.
    - Mirror the stabilized calculate output shell with result summary, toolbar shell, tabs shell, table shell, and JSON panel.
    - Start sortable line-item output on ID when stable row order exists.
    - Keep output action buttons compact and boxed, not oversized pills.
    - Use Example Prompts with Copy prompt controls for preset-aligned estimate briefs.
    - Use Example Inputs only for calculators with no prompt, brief, or preset-copy workflow.
    - Keep support markdown tables aligned with fixed layout, wrapping, and no forced content-column overflow.
    - Do not copy provider-specific language, service names, pricing assumptions, category/provider tokens, or chart colors into unrelated calculators.
    - Apply category/provider token lineage, restrained visual weight, and tool-specific namespace.
    - Keep CSS and JavaScript scoped to the final tool.
    - Keep content domain-native and aligned with actual behavior.
    - Use family workspace source from templates/content/family/calculate/workspace/.
    - Keep every calculate workspace section aligned to the family section bundle contract: README.md, demo.html, page.html.twig, section.css, and section.js.
    - When the user says to baseline a calculate tool, extract stabilized markup, CSS, and JavaScript into matching section-owned workspace files.
    - Use shared content section source from templates/content/main/sections/content/.
    - Apply shared main content sections as a full contract: content.md markup, section.css visual behavior, and section.js helper behavior when present.
    - Final tool custom.css and custom.js must preserve the applied section card frame, heading divider, typography, table, list, details, FAQ, copy, citation, prompt, or command behavior unless a documented shared include exists.
    - Use 10_references for complete factual content delivery and when final content includes valid source-backed citations, with in-text citation links targeting matching References row IDs.
    - Do not create a family-local sections/ directory.

validation_rules:
    - README.md exists.
    - manifest.yml exists.
    - workspace/README.md exists.
    - workspace/manifest.yml exists.
    - Shared main content section source exists under templates/content/main/sections/content/.
    - Applied shared content sections are validated in the final tool package for namespace markers, unresolved placeholders, required custom.css selectors, and helper hooks when used.
    - Citation links and References rows are paired when 10_references is used.
    - baseline/source/tool.html.twig, baseline/source/custom.css, and baseline/source/custom.js exist.
    - Calculate workspace section folders exist under templates/content/family/calculate/workspace/.
    - Each calculate workspace section folder contains README.md, demo.html, page.html.twig, section.css, and section.js.
    - workspace/custom.css, workspace/custom.js, and workspace/demo.html.twig do not exist.
    - Declared reference tool paths exist.
    - Reusable workspace section examples are provider-neutral unless a section explicitly documents a provider-specific example.
    - No duplicated calculate sections/ directory exists under templates/content/family/calculate/.
    - Required final output files are created in the final tool package.
    - Required first-line markers are present.
    - Tool namespace is unique.
    - CSS is scoped under the tool root.
    - JavaScript DOM references match Twig IDs.
    - Calculations use a normalized model.
    - Export controls match implemented exports.
    - Import controls appear only when JSON restore is implemented and validated.
    - JSON output matches the current result payload.
    - Result summary, visible tables, tabs, exports, and JSON are generated from the same normalized model.
    - Example Prompt copy controls target the matching prompt block without duplicate generic copy buttons.
    - Support markdown tables do not clip Overview, service-driver, or review-boundary columns.
    - Content does not claim live pricing, billing accuracy, compliance, or production readiness unless validated.
    - Provider-adapted tools include a copied-token scan for provider names and category/provider lineage tokens.
