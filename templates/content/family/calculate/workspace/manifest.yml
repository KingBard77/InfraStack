source: calculate-family-workspace
family: calculate
version: 1.4.0
status: active
description: Family-specific workspace grammar for InfraStack calculator tools using the current AWS, Azure, and IBM Cloud cost calculators for structure, provider adaptation, category/provider token handling, result summary, output toolbar, table shell, prompt examples, and JSON restore baseline.
agent_map: templates/content/family/calculate/FAMILY.md

family_path: templates/content/family/calculate/
workspace_path: templates/content/family/calculate/workspace/
scaffold_path: templates/content/main/scaffold/
main_sections_path: templates/content/main/sections/

section_runtime_baseline:
    source_tools:
        - path: templates/content/tools/aws/calculate-cost-aws/
          role: primary structural reference
        - path: templates/content/tools/azure/calculate-cost-azure/
          role: Azure provider-adaptation and category/provider token reference
        - path: templates/content/tools/ibm/calculate-cost-ibm/
          role: IBM Cloud provider-adaptation and category/provider token reference
    source_snapshot: templates/content/family/calculate/baseline/source/
    role: Section-owned page.html.twig, section.css, section.js, and demo.html files are the reusable baseline. The source snapshot is reference-only. Do not keep root workspace custom.css, custom.js, or demo.html.twig files.

runtime_baseline:
    source_tool: templates/content/tools/aws/calculate-cost-aws/
    source_snapshot: templates/content/family/calculate/baseline/source/
    workspace_sections: templates/content/family/calculate/workspace/
    copy_mode: section_owned
    source_hashes:
        tool_html_twig: bd204d9469580503ca6350a65c9f05eaecda415db972dbb6b19cea9999c179d8
        custom_css: 1644c71c96b9c9bd0c519347cc1a474bb374ee3a80c3b91993e1b61ba756c200
        custom_js: ab9dcdab32504d365194865e9c5f169e1adbbc3f4f2347619aa6b81197037db8
    rule: Keep the full copied calculate source under baseline/source/ as a reference-only snapshot. Extract stabilized runtime structure into matching section-owned files instead of carrying root workspace runtime files.

