selection_triggers:
    - calculate
    - calculator
    - estimate
    - estimator
    - pricing
    - cost
    - sizing
    - capacity
    - budget
    - run-rate

workspace_flow:
    - estimate_label_or_scenario
    - preset_or_basic_settings
    - service_or_component_cards
    - advanced_assumptions_rates_overrides
    - result_summary
    - output_toolbar_sort_copy_export_import
    - result_tabs_table_shell
    - json_payload_output_restore

workspace_sections:
    01_input-brief: estimate label, scenario, or brief input and estimate/reset actions
    02_basic-settings: preset and required estimate settings
    03_advanced-settings: component/service cards, rates, quantities, assumptions, overrides, and buffers
    04_selected-item: optional selected line item or component inspector; no-op unless a calculator supports selection
    05_result-summary: two-column result overview, primary answer card, metrics, chips, and top drivers
    06_result-view: breakdown, service mix, assumptions, methodology, recommendations, and result tabs
    07_table-export: ID-first line-item sort, row copy actions, CSV, report, JSON, and optional import controls
    08_json-restore: calculator JSON payload output and optional restore handling

section_file_contract:
    required_per_section:
        - README.md
        - demo.html
        - page.html.twig
        - section.css
        - section.js
    role: Keep calculate workspace sections structurally equivalent to architecture workspace sections while preserving calculate-specific behavior.

scaffold_content_adaptation:
    01_overview: calculator purpose, input boundary, and output boundary
    02_technical-details: normalized inputs, assumptions, rates, and formulas
    03_example-prompts: preset-aligned Example Prompts with Copy prompt controls and centered title-case terminal titles; use Example Inputs only when no prompt or brief workflow exists
    04_tips-prompts: input tips and assumption guidance
    05_how-to-use: estimate workflow
    06_export-notes: PDF, CSV, JSON, copy, and import restore boundaries
    07_faq: calculator trust boundaries and pricing limitations
    08_acronyms: optional abbreviation expansion table; domain, pricing, and estimate acronyms
    11_glossary: optional broader terminology table; broader domain, command, workflow, platform, or estimate terminology
    10_references: complete factual content delivery, valid source-backed citations, and References rows when final calculate content cites sources

state_contract:
    - label_or_scenario
    - preset
    - included_services_or_components
    - quantities
    - rates
    - assumptions
    - overrides
    - totals
    - result_summary
    - output_toolbar
    - tables
    - exports
    - json_output
    - json_restore_when_implemented

generation_rules:
    - Select this workspace source for calculate-family tool requests.
    - Use this workspace source for calculate-specific workspace sections.
    - Keep each workspace section folder complete with README.md, demo.html, page.html.twig, section.css, and section.js.
    - Keep full copied calculate source under baseline/source/ as a reference-only snapshot when refreshing this baseline.
    - When a calculate tool is accepted as a baseline source, extract stabilized markup, CSS, and JavaScript into matching section-owned workspace files.
    - Use shared main content sections for reusable content rhythm.
    - Apply shared main content sections as a full contract: content.md markup, section.css visual behavior, and section.js helper behavior when present.
    - Final tool custom.css and custom.js must preserve the applied section card frame, heading divider, typography, table, list, details, FAQ, copy, citation, prompt, or command behavior unless a documented shared include exists.
    - Use 10_references for complete factual content delivery and when final content includes valid source-backed citations, with in-text citation links targeting matching References row IDs.
    - Do not create a family-local sections/ directory.
    - Do not copy AWS, Azure, IBM Cloud, or other provider pricing language into unrelated calculators.
    - Use AWS Cost Calculator as the structural reference and Azure plus IBM Cloud as provider-adaptation references.
    - Keep result summaries balanced across a primary answer card and supporting metric cards.
    - Keep output toolbar controls boxed, compact, and grouped by sort versus actions.
    - Default line-item sort to ID when stable row order exists.
    - Keep support content tables aligned with fixed layout and wrapping.
    - Use Example Prompts with paired Copy prompt buttons for preset-aligned estimate briefs.
    - Show Import JSON only when restore rebuilds the normalized model and visible outputs.
    - Preserve calculate-family input-to-result grammar while adapting labels, category/provider tokens, examples, formulas, and export behavior.
    - Replace copied category/provider tokens across workspace CSS, markdown support CSS, and chart JavaScript before closing a provider variant.
    - Generate final runtime files under templates/content/tools/<category>/<tool-slug>/.

validation_rules:
    - workspace/README.md exists.
    - workspace/manifest.yml exists.
    - reference workspace paths exist when used.
    - baseline/source/tool.html.twig, baseline/source/custom.css, and baseline/source/custom.js exist.
    - calculate workspace section folders exist.
    - workspace/custom.css, workspace/custom.js, and workspace/demo.html.twig do not exist.
    - every calculate workspace section folder contains README.md, demo.html, page.html.twig, section.css, and section.js.
    - shared main content section source exists.
    - Applied shared content sections are validated in the final tool package for namespace markers, unresolved placeholders, required custom.css selectors, and helper hooks when used.
    - citation links and References rows are paired when 10_references is used.
    - no family-local sections/ directory exists.
    - final tool input controls, totals, tables, exports, and JSON use one normalized model.
    - output toolbar, tabs shell, table shell, and JSON panel match implemented behavior.
    - import restore is validated when shown.
    - reusable workspace section examples are provider-neutral unless a section explicitly documents a provider-specific example.
    - provider-adapted tools include copied-token scans for provider names and category/provider lineage tokens.
