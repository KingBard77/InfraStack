<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calculate Result Tabs Demo</title>
  <style>
:root { --default-font: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
* { box-sizing: border-box; }
body { margin: 0; background: #f8fafc; font-family: var(--default-font); color: #111827; }
.demo-shell { width: min(1180px, calc(100% - 32px)); margin: 40px auto; }
.demo-title { display: flex; align-items: center; gap: 10px; margin: 0 0 16px; color: #0f172a; font-size: 18px; font-weight: 800; letter-spacing: 0; }
.demo-title-icon { width: 32px; height: 32px; border: 1px solid #fdba74; border-radius: 10px; display: inline-flex; align-items: center; justify-content: center; background: #fff7ed; color: #c2410c; flex: 0 0 auto; }
.demo-title-icon i { font-size: 16px; line-height: 1; }
.demo-title-text { min-width: 0; }
.__TOOL_CLASS__ { color: #111827; }
.__TOOL_CLASS__ .tool-box { border: 1px solid #d7e3f5; border-radius: 18px; background: #f8fbff; padding: 20px; }
.__TOOL_CLASS__ .tool-shell, .__TOOL_CLASS__ .tool-inspector-section, .__TOOL_CLASS__ .tool-result-section-card { border: 1px solid #dbeafe; border-radius: 16px; background: #fff; }
.__TOOL_CLASS__ .tool-shell { padding: 18px; box-shadow: 0 18px 45px rgba(15, 23, 42, 0.08); }
.__TOOL_CLASS__ .form-control, .__TOOL_CLASS__ .form-select { width: 100%; border: 1px solid #cbd5e1; border-radius: 10px; background: #fff; padding: 10px 12px; color: #111827; font: 700 14px/1.4 var(--default-font); }
.__TOOL_CLASS__ .btn, .__TOOL_CLASS__ button { font: 800 13px/1.2 var(--default-font); }
.__TOOL_CLASS__ .d-none, .__TOOL_CLASS__ [hidden] { display: none !important; }
.__TOOL_CLASS__ table { width: 100%; border-collapse: collapse; }
.__TOOL_CLASS__ th, .__TOOL_CLASS__ td { border-bottom: 1px solid #e2e8f0; padding: 10px; text-align: left; vertical-align: top; }
  </style>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="section.css">
</head>
<body>
  <main class="demo-shell">
    <h1 class="demo-title"><span class="demo-title-icon"><i class="bi bi-calculator" aria-hidden="true"></i></span><span class="demo-title-text">Calculate Result Tabs Demo</span></h1>
    <div class="__TOOL_CLASS__">
      <div class="tool-box">
              <div class="__PREFIX__-tabs-shell">
                <div class="__PREFIX__-tabs" role="tablist" aria-label="AWS cost estimate output views">
                  <button type="button" class="__PREFIX__-tab-btn active" data-tab-target="breakdown" role="tab" aria-selected="true">
                    <i class="bi bi-list-check" aria-hidden="true"></i>
                    <span>Breakdown</span>
                  </button>
                  <button type="button" class="__PREFIX__-tab-btn" data-tab-target="services" role="tab" aria-selected="false">
                    <i class="bi bi-pie-chart" aria-hidden="true"></i>
                    <span>Service Mix</span>
                  </button>
                  <button type="button" class="__PREFIX__-tab-btn" data-tab-target="assumptions" role="tab" aria-selected="false">
                    <i class="bi bi-card-list" aria-hidden="true"></i>
                    <span>Assumptions</span>
                  </button>
                  <button type="button" class="__PREFIX__-tab-btn" data-tab-target="recommendations" role="tab" aria-selected="false">
                    <i class="bi bi-lightbulb" aria-hidden="true"></i>
                    <span>Recommendations</span>
                  </button>
                  <button type="button" class="__PREFIX__-tab-btn" data-tab-target="json" role="tab" aria-selected="false">
                    <i class="bi bi-braces" aria-hidden="true"></i>
                    <span>JSON</span>
                  </button>
                </div>

                <div class="__PREFIX__-tab-panel" data-tab-panel="breakdown" role="tabpanel">
                  <div class="__PREFIX__-section-card tool-result-section-card">
                    <h3 class="__PREFIX__-section-title tool-result-section-title">Line-Item Breakdown</h3>
                    <div class="table-responsive __PREFIX__-table-wrap tool-result-table-wrap">
                      <table class="table __PREFIX__-breakdown-table mb-0 tool-result-table">
                        <thead>
                          <tr>
                            <th class="tool-generated-rownum-head">#</th>
                            <th>Service</th>
                            <th>Driver</th>
                            <th>Usage</th>
                            <th>Unit basis</th>
                            <th>Monthly</th>
                            <th>Annual</th>
                            <th>Copy</th>
                          </tr>
                        </thead>
                        <tbody id="__DOM_PREFIX__BreakdownTableBody"></tbody>
                      </table>
                    </div>
                  </div>
                </div>

                <div class="__PREFIX__-tab-panel d-none" data-tab-panel="services" role="tabpanel">
                  <div class="__PREFIX__-section-card tool-result-section-card">
                    <h3 class="__PREFIX__-section-title tool-result-section-title">Service Mix</h3>
                    <div class="table-responsive __PREFIX__-table-wrap __PREFIX__-table-wrap-compact tool-result-table-wrap">
                      <table class="table __PREFIX__-service-table mb-0 tool-result-table tool-result-table--compact">
                        <thead>
                          <tr>
                            <th class="tool-generated-rownum-head">#</th>
                            <th>Service</th>
                            <th>Monthly</th>
                            <th>Annual</th>
                            <th>Share</th>
                            <th>Signal</th>
                            <th>Copy</th>
                          </tr>
                        </thead>
                        <tbody id="__DOM_PREFIX__ServiceTableBody"></tbody>
                      </table>
                    </div>
                  </div>

                </div>

                <div class="__PREFIX__-tab-panel d-none" data-tab-panel="assumptions" role="tabpanel">
                  <div class="__PREFIX__-section-card tool-result-section-card">
                    <h3 class="__PREFIX__-section-title tool-result-section-title">Assumptions</h3>
                    <div class="table-responsive __PREFIX__-table-wrap __PREFIX__-table-wrap-compact tool-result-table-wrap">
                      <table class="table __PREFIX__-assumption-table mb-0 tool-result-table tool-result-table--compact">
                        <thead>
                          <tr>
                            <th class="tool-generated-rownum-head">#</th>
                            <th>Assumption</th>
                            <th>Value</th>
                            <th>Note</th>
                            <th>Copy</th>
                          </tr>
                        </thead>
                        <tbody id="__DOM_PREFIX__AssumptionTableBody"></tbody>
                      </table>
                    </div>
                  </div>

                  <div class="__PREFIX__-method-grid" id="__DOM_PREFIX__Methodology"></div>
                </div>

                <div class="__PREFIX__-tab-panel d-none" data-tab-panel="recommendations" role="tabpanel">
                  <div class="__PREFIX__-recommendation-grid" id="__DOM_PREFIX__Recommendations"></div>
                </div>

              </div>
      </div>
    </div>
  </main>
  <script src="section.js"></script>
  <script>
    if (window.InfraStackCalculateWorkspaceSections && typeof window.InfraStackCalculateWorkspaceSections.resultTabs === 'function') {
      window.InfraStackCalculateWorkspaceSections.resultTabs(document);
    }
  </script>
</body>
</html>
