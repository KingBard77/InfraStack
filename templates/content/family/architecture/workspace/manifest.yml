source: architecture-family-workspace
family: architecture
version: 1.4.1
status: active
description: Family-specific workspace grammar for InfraStack architecture tools.
baseline_snapshot: "2026-05-18"
agent_map: templates/content/family/architecture/AGENTS.md

family_path: templates/content/family/architecture/
workspace_path: templates/content/family/architecture/workspace/
scaffold_path: templates/content/main/scaffold/
main_sections_path: templates/content/main/sections/

reference_workspace:
    title: AWS VPC Architecture
    path: templates/content/tools/aws/architecture-vpc-aws/
    aliases:
        - AWS VPC Architecture
        - AWS VPC architecture
        - aws-vpc-architecture
        - architecture-vpc-aws
    role: Working reference implementation for architecture workspace grammar.

runtime_baseline:
    source_tool: templates/content/tools/aws/architecture-vpc-aws/
    source_snapshot: templates/content/family/architecture/baseline/source/
    workspace_sections: templates/content/family/architecture/workspace/
    model_core: templates/content/family/architecture/workspace/assets/bin/model-core.js
    copy_mode: section_owned
    css_js_mode: section_owned_extracted
    root_runtime_snapshots: false
    source_marker_mode: namespace_marker_anchored
    source_markers:
        syntax: "ns:start/ns:end family.architecture.workspace.<section>"
        files:
            - tool.html.twig
            - custom.css
            - custom.js
    extracted_runtime_sources:
        css:
            shared_foundation: repeated minimal section demo foundation only
            section_specific: workspace section.css owns only the CSS needed by its section
            forbidden: full custom.css copies inside section folders
        js:
            source_ownership_maps: workspace section.js records section-specific custom.js line ranges, DOM IDs, classes, variables, functions, and behaviors
            forbidden: full custom.js runtime strings inside section folders
    model_core_sha256: cf9110167b5ab4e2bd108f2bfdcc6b7939bbc99d941ab891ebb59cd658242bb2
    source_hashes:
        tool_html_twig: 117931f15ad2a68656043077b4e807f0975d9ce30783a9e55e62993bb6677b86
        custom_css: ce4b668b97a948fe9f3e3e23d63b6bb1c33f1356188f00a12a3a8d8d22eb6f0a
        custom_js: 87e65e2126432eade9dab0e02d9bfb26e3f1a7961e7e25f05cbb99b30edcd966
        model_core: cf9110167b5ab4e2bd108f2bfdcc6b7939bbc99d941ab891ebb59cd658242bb2

selection_triggers:
    - architecture
    - diagram
    - topology
    - flow
    - dependency map
    - visual planner
    - editable visual model
    - prompt-driven diagram

workspace_flow:
    - prompt_or_preset_input
    - basic_controls
    - custom_controls
    - selected_item_controls_when_editable
    - result_text_and_metadata
    - diagram_toolbar_and_stage
    - score_or_status_card
    - sort_and_export_toolbar
    - inventory_assessment_notes_export_json_restore_state

workspace_sections:
    01_input-brief: architecture prompt or topology brief and generate/reset actions
    02_basic-settings: preset, region, zone, scope, and baseline select controls
    03_advanced-settings: network, workload, service, security, label, and output controls
    04_selected-item: selected stage object or connector editor and editable-state hints
    05_result-text: stage title, preset chip, metadata, pre-generate notice, and generated text summary
    06_result-diagram: diagram stage, connector selection, connector handles, toolbar, zoom, fullscreen, reset, usage help, and visual output
    07_score-card: advisory score, quality, status, readiness, risk, or assumption summary card
    08_sort-card: inventory sort control and implemented PNG, SVG, JSON, and import actions
    09_result-table: inventory, secondary tables, prompt notes, pillar breakdown, risk level, JSON output, import, restore, and normalized state boundary

baseline_rules:
    diagram_layout_quality_source: templates/content/family/architecture/AGENTS.md
    diagram_layout_quality:
        color_identity_source: codex/COLOR.md
        required:
            - centered_main_traffic_path
            - aligned_top_level_flow_boxes
            - equal_container_subnet_and_section_gaps
            - symmetrical_repeated_zone_or_az_columns
            - rounded_primary_cards_and_containers_16px_to_20px
            - thin_soft_blue_structural_borders
            - soft_shadows
            - persistent_orthogonal_connectors
            - consistent_thin_connector_strokes
            - fixed_arrowhead_sizing
            - invisible_wide_connector_hit_targets
            - connector_click_selection
            - connector_anchor_and_bend_handles_when_editable
            - outside_edge_side_anchors_for_mirrored_columns
            - preset_content_changes_only
    stage_interaction:
        selectable_boxes: true
        movable_boxes_when_model_allows: true
        draggable_cursor_feedback: true
        selected_ring_and_handles_without_layout_shift: true
        inspector_sync: true
        grid_safe_highlight: true
        normalized_layout_overrides: true
        reset_clears_layout_and_connector_overrides: true
        escape_or_outside_clear_where_practical: true
    connector_contract:
        persistent_svg_paths: true
        orthogonal_routing_default: true
        thin_visual_stroke: true
        fixed_arrowhead_size: true
        invisible_hit_target_width: 18px
        selectable_connectors: true
        anchor_and_bend_handles_when_editable: true
        normalized_connector_overrides: true
        redraw_on_box_move: true
        labels_do_not_overlap_boxes_where_practical: true
    info_markers:
        apply_to:
            - helper_text
            - body_notes
        do_not_apply_to:
            - headings
            - labels
            - tabs
            - buttons
            - every_text_node
    pre_generate_output_notice: Generate an architecture diagram to review technical inventory, service mix, and exportable JSON.
    selected_item_empty_language: draggable_box
    output:
        sort_default: id
        tabs:
            - Technical Inventory
            - Prompt Notes
            - Pillar Breakdown
            - Risk Level
            - JSON
        secondary_table_sections:
            - Routing Summary
            - Control Notes
        assessment_tabs:
            - Pillar Breakdown
            - Risk Level
        assessment_summary_rule: Advisory model summaries only; do not claim compliance, certification, security validation, reliability validation, or production readiness proof.
        basic_dropdown_control_height: 46px
        basic_dropdown_implementation: custom_select_enhancement
        basic_dropdown_menu_width: trigger
        basic_placeholder_chip: false
        sort_control_min_height: 46px
        sort_dropdown_menu_width: trigger
        sort_summary_content: selected_sort_label_only
        sort_placeholder_chip: false
        inventory_columns:
            - "#"
            - Component
            - Placement
            - Purpose
            - Action
        action_column_control: copy_row_button
        demo_state: before_after_dummy_result_states
        before_after_demo_sections:
            - 04_selected-item
            - 06_result-diagram
            - 09_result-table
    provider_language: Translate AWS reference wording for non-AWS final tools.

scaffold_content_adaptation:
    01_overview: architecture purpose, input, output, and review boundary
    02_technical-details: parser, model, stage, export, and restore behavior
    03_example-prompts: provider/domain-native architecture prompts with centered title-case terminal titles
    04_tips-prompts: prompt guidance for topology, placement, and controls
    05_how-to-use: prompt, preset, generate, inspect, edit, export, and restore workflow
    06_export-notes: PNG, SVG, JSON, restore, and share boundaries
    07_faq: architecture trust boundaries and edit/export behavior
    08_acronyms: optional abbreviation expansion table; provider/domain architecture acronyms
    11_glossary: optional broader terminology table; broader domain, command, workflow, platform, or estimate terminology
    10_references: complete factual content delivery, valid source-backed citations, and References rows when final architecture content cites sources

state_contract:
    - prompt
    - preset
    - controls
    - stage_objects
    - selected_object
    - layout_overrides
    - connector_overrides
    - inventory
    - notes
    - score_or_status
    - exports
    - json_restore

generation_rules:
    - Select this workspace source for architecture-family tool requests.
    - Use this workspace source for architecture-specific workspace sections.
    - Keep full copied architecture source under baseline/source/ as a reference-only snapshot when refreshing this baseline.
    - Use ns:start/ns:end family.architecture.workspace.<section> markers in baseline source files before refreshing workspace section files.
    - Use section-owned section.css and section.js files for architecture workspace CSS and JavaScript.
    - Keep section.css extracted to the relevant section selectors plus the minimal shared demo foundation only.
    - Keep section.js extracted to the relevant custom.js ownership map; do not embed the whole runtime in a section.js string.
    - Do not keep root workspace/custom.css, workspace/custom.js, or workspace/demo.html.twig snapshot files.
    - Use workspace/assets/bin/model-core.js only as a reusable model-core reference when final tools need it.
    - Use shared main content sections for reusable content rhythm.
    - Apply shared main content sections as a full contract: content.md markup, section.css visual behavior, and section.js helper behavior when present.
    - Final tool custom.css and custom.js must preserve the applied section card frame, heading divider, typography, table, list, details, FAQ, copy, citation, prompt, or command behavior unless a documented shared include exists.
    - Use 10_references for complete factual content delivery and when final content includes valid source-backed citations, with in-text citation links targeting matching References row IDs.
    - Do not create a family-local sections/ directory.
    - Do not copy AWS provider language into non-AWS tools.
    - Preserve architecture-family workflow grammar while adapting labels, icons, category/provider tokens, examples, and model logic.
    - Preserve the diagram layout quality source while adapting content per provider or domain.
    - Render Pillar Breakdown and Risk Level from the normalized model after generation.
    - Treat Pillar Breakdown and Risk Level as advisory model summaries, not compliance, certification, security, reliability, or production proof.
    - Keep Basic dropdowns on the baseline select wrapper, custom styled menu, trigger-width dropdown menu, focus ring, 46px control height, and no placeholder-chip overlay.
    - Keep Sort dropdown aligned to the Basic select control height: 46px trigger, trigger-width menu, selected sort label only, and no placeholder chip.
    - Use secondary output table cards for routing, control, or domain summary rows when normalized model data includes them.
    - Keep category/provider token tuning separate until explicitly approved for the family baseline.
    - Keep body-only info marker behavior.
    - Keep the pre-generate output notice exact.
    - Keep 04_selected-item, 06_result-diagram, and 09_result-table demos capable of showing before/after dummy states where practical.
    - Keep before/after section demos stacked as two rows in one column.
    - Keep 09_result-table demo in generated dummy table, secondary table, assessment, JSON output, and restore boundary state.
    - Use copy-row buttons in the result table Action column instead of long text.
    - Treat connector hit targets, connector selection, anchor handles, bend handles, fixed arrowheads, and connector override persistence as reusable architecture-family behavior when connectors are editable.
    - Generate final runtime files under templates/content/tools/<category>/<tool-slug>/.

validation_rules:
    - workspace/README.md exists.
    - workspace/manifest.yml exists.
    - baseline/source/tool.html.twig, baseline/source/custom.css, baseline/source/custom.js, and baseline/source/assets/bin/model-core.js exist.
    - baseline/source/tool.html.twig, baseline/source/custom.css, and baseline/source/custom.js contain ns:start/ns:end family.architecture.workspace markers.
    - baseline/source files do not use legacy source:start or source:end markers for architecture workspace extraction.
    - root workspace/custom.css does not exist.
    - root workspace/custom.js does not exist.
    - root workspace/demo.html.twig does not exist.
    - section.css files are not full custom.css copies.
    - section.js files are not full custom.js runtime copies.
    - section.js files do not contain String.raw custom.js snapshots, provider icon include blocks, model-core includes, or initArchitectureVpcAwsTool copies.
    - reference workspace path exists when used.
    - architecture workspace section folders exist.
    - shared main content section source exists.
    - Applied shared content sections are validated in the final tool package for namespace markers, unresolved placeholders, required custom.css selectors, and helper hooks when used.
    - citation links and References rows are paired when 10_references is used.
    - no family-local sections/ directory exists.
    - final tool state, stage, output, export, and JSON restore use one normalized model.
    - Pillar Breakdown and Risk Level tabs are populated from the normalized model and do not overclaim validation.
    - Sort dropdown renders the selected sort label only and keeps the Basic 46px trigger height with a trigger-width menu.
    - Secondary output table sections render from normalized model data or are omitted.
    - generated diagram presets preserve layout quality and adapt content only.
    - connectors use persistent orthogonal paths with consistent arrow and stroke treatment.
    - connectors use invisible wide hit targets when connector editing is implemented.
    - connector arrowheads keep fixed user-space sizing while the stage zoom changes.
    - connector selection exposes anchor or bend handles when connector editing is implemented.
    - moving a connected box redraws affected connector paths.
    - mirrored column connector routes use outside-edge side anchors for vertical fan-out and tier-to-tier paths when that keeps labels clear.
    - horizontal peer, standby, failover, or replication paths use inner-side anchors when spanning columns.
