family: assessment
version: 1.0.0
status: active
description: Baseline template for InfraStack browser-first assessment tools with searchable scope controls, ID-first tables, selected artifact review, copy/export actions, and JSON snapshot boundaries.
agent_map: templates/content/family/assessment/FAMILY.md

baseline_path: templates/content/family/assessment/
preferred_baseline_path: templates/content/family/assessment/
workspace_path: templates/content/family/assessment/workspace/
scaffold_path: templates/content/main/scaffold/
main_sections_path: templates/content/main/sections/

runtime_baseline:
    source_tool: templates/content/tools/cis/assess-ubuntu-2204-cis/
    source_snapshot: templates/content/family/assessment/baseline/source/
    workspace_sections: templates/content/family/assessment/workspace/
    copy_mode: section_owned
    css_js_mode: section_owned
    model_core: null
    model_core_sha256: null
    data_payload_source: templates/content/family/assessment/baseline/source/assets/custom.json.twig
    data_payload_sha256: b8593d6097526c15bda181237cc599b229a4caff1d8faa46d8471ef1bbe3bc8c
    tool_markup_sha256: d9cef445d2909e737523b173ae94b12b55ece67ff953bf1837ed72d7b10a0a8b
    source_hashes:
        tool_html_twig: d9cef445d2909e737523b173ae94b12b55ece67ff953bf1837ed72d7b10a0a8b
        custom_css: 7826c5ae39bbe50145875a34912e44d0f5f4df7163fac56f9b2704542c9d600a
        custom_js: 78b269bbc8fd8d6d8cfe175cae312580d5f093392da3eac808706c8244eac12d
        custom_json_twig: b8593d6097526c15bda181237cc599b229a4caff1d8faa46d8471ef1bbe3bc8c
    rule: Keep the full copied assessment source under baseline/source/ as a reference-only snapshot. Extract reusable assessment behavior into section-owned workspace files.

reference_tool:
    path: templates/content/tools/cis/assess-ubuntu-2204-cis/
    purpose: Current working baseline reference for assessment-family composition. Use the workflow grammar and quality bar, not CIS-specific wording.
    aliases:
        - CIS Ubuntu Benchmark 2204
        - CIS Ubuntu 22.04 Benchmark
        - cis-ubuntu-benchmark-2204
        - assess-ubuntu-2204-cis

applies_to:
    - compliance explorers
    - hardening assessment tools
    - readiness assessments
    - risk assessments
    - posture assessments
    - control coverage reviews
    - maturity assessments
    - configuration quality reviews
    - benchmark browsers

section_adaptation:
    content:
        01_overview: assessment purpose, input boundary, output boundary, and trust boundary
        02_technical-details: catalogue source, normalized filters, result model, selected artifact loading, and export behavior
        03_example-prompts: assessment prompts or non-command example inputs with paired copy controls
        09_example-commands: literal assessment commands with paired Copy command controls
        example_terminal_title: centered title case
        04_tips-prompts: filter tips, review tips, and safe execution guidance when commands are shown
        05_how-to-use: assess, filter, inspect, copy, export, and review workflow
        06_export-notes: copy, CSV, PDF or print, JSON, and import restore boundaries
        07_faq: assessment trust boundaries and validation limitations
        08_acronyms: optional abbreviation expansion table; domain, benchmark, security, or operations acronyms
        11_glossary: optional broader terminology table; broader domain, command, workflow, platform, or estimate terminology
        10_references: complete factual content delivery, valid source-backed citations, and References rows when final assessment content cites sources
    workspace:
        01_input-brief: primary query, brief, assessment filter, and assess/explore action
        02_basic-settings: scope, section, severity, status, profile, row-limit, and required selectors
        03_advanced-settings: optional advanced filters or assessment options; no-op unless separated from basic scope
        04_selected-item: selected script, rule, finding, requirement, evidence, or source body review
        05_result-summary: matched counts, selected item, coverage, gaps, status, and metadata summary cards
        06_result-view: findings/control table plus section, family, category, severity, status, or ownership rollups
        07_table-export: ID-first sort, compact actions, copy, CSV, report, JSON, and optional import controls
        08_json-restore: assessment JSON snapshot output and optional restore handling

workspace_section_file_contract:
    required_per_section:
        - README.md
        - demo.html
        - page.html.twig
        - section.css
        - section.js
    role: Match the architecture family section bundle shape so each assessment workspace section has documentation, isolated demo markup, reusable Twig, scoped CSS, and scoped JavaScript.

required_output_files:
    - card.yml
    - content.md
    - custom.css
    - custom.js
    - meta.yml
    - tool.html.twig

optional_output_files:
    - assets/bin/model-core.js
    - assets/custom.json.twig
    - assets/icon/
    - assets/img/post.html.twig
    - src/Controller/Tools/<Category>/<Tool>/CustomController.php

required_first_line_markers:
    content.md: "[//]: # (content.md)"
    card.yml: "# card.yml"
    custom.css: "/* custom.css */"
    custom.js: "// custom.js"
    meta.yml: "# meta.yml"
    tool.html.twig: "{# tool.html.twig #}"

workspace_flow:
    - assessment_filter_or_query
    - scope_selectors
    - explicit_explore_or_assess_action
    - result_summary
    - output_toolbar_sort_copy_export_import
    - findings_or_controls_table
    - group_rollups
    - selected_artifact_review
    - json_snapshot_output_restore_when_implemented

export_priority:
    - copy_selected_artifact_or_row
    - CSV
    - JSON
    - PDF_or_print_report
    - Import_JSON_restore_when_implemented

generation_rules:
    - Use this family template as the baseline for assessment tools.
    - Use assess as the preferred family verb for new assessment tool identities.
    - Generate the final runtime package under templates/content/tools/<category>/<tool-slug>/.
    - Do not use the family directory as the final runtime package.
    - Do not omit tool-local files because the family source exists.
    - Keep full copied assessment source under baseline/source/ as a reference-only snapshot when refreshing this baseline.
    - Keep reusable assessment workspace behavior in section-owned page.html.twig, section.css, section.js, and demo.html files.
    - Use CIS Ubuntu Benchmark 2204 as the current working baseline reference for assessment UI composition.
    - Do not copy CIS, Ubuntu, benchmark, shell, or compliance wording into unrelated assessment tools.
    - Apply category/provider token lineage, restrained visual weight, and tool-specific namespace.
    - Keep CSS and JavaScript scoped to the final tool.
    - Keep content domain-native and aligned with actual behavior.
    - Use family workspace source from templates/content/family/assessment/workspace/.
    - Use shared content section source from templates/content/main/sections/content/.
    - Apply shared main content sections as a full contract: content.md markup, section.css visual behavior, and section.js helper behavior when present.
    - Final tool custom.css and custom.js must preserve the applied section card frame, heading divider, typography, table, list, details, FAQ, copy, citation, prompt, or command behavior unless a documented shared include exists.
    - Use 10_references for complete factual content delivery and when final content includes valid source-backed citations, with in-text citation links targeting matching References row IDs.
    - Do not create a family-local sections/ directory.
    - Keep result areas hidden or in a pre-run notice state until the primary action or restore state generates output.
    - Keep stable assessment rows sorted by ID by default.
    - Keep row copy actions in a dedicated copy/action column.
    - Show Import JSON only when restore rebuilds the normalized model and visible outputs.
    - State assessment trust boundaries clearly.

validation_rules:
    - README.md exists.
    - manifest.yml exists.
    - workspace/README.md exists.
    - workspace/manifest.yml exists.
    - Shared main content section source exists under templates/content/main/sections/content/.
    - Applied shared content sections are validated in the final tool package for namespace markers, unresolved placeholders, required custom.css selectors, and helper hooks when used.
    - Citation links and References rows are paired when 10_references is used.
    - Assessment workspace section folders exist under templates/content/family/assessment/workspace/.
    - Each assessment workspace section folder contains README.md, demo.html, page.html.twig, section.css, and section.js.
    - baseline/source/tool.html.twig, baseline/source/custom.css, baseline/source/custom.js, and baseline/source/assets/custom.json.twig exist.
    - Root workspace/custom.css and workspace/custom.js do not exist.
    - No duplicated assessment sections/ directory exists under templates/content/family/assessment/.
    - Required final output files are created in the final tool package.
    - Required first-line markers are present.
    - Tool namespace is unique.
    - CSS is scoped under the tool root.
    - JavaScript DOM references match Twig IDs.
    - Assessment output uses one normalized model.
    - Export controls match implemented exports.
    - Import controls appear only when JSON restore is implemented and validated.
    - JSON output matches the current result payload.
    - Summary, tables, selected artifact, exports, and JSON are generated from the same normalized model.
    - Copy controls target the matching current row, artifact, command, input, or JSON payload.
    - Support markdown tables do not clip required columns.
    - Content does not claim compliance, security, certification, or production readiness unless validated.
