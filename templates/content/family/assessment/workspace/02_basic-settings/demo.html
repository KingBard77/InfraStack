<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Assessment Scope Selectors Demo</title>
  <style>
:root { --default-font: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
* { box-sizing: border-box; }
body { margin: 0; background: #f8fafc; font-family: var(--default-font); color: #111827; }
.demo-shell { width: min(1180px, calc(100% - 32px)); margin: 40px auto; }
.demo-title { margin: 0 0 16px; color: #0f172a; font-size: 18px; font-weight: 800; letter-spacing: 0; }
.__TOOL_CLASS__ { color: #111827; }
.__TOOL_CLASS__ .tool-box { border: 1px solid #d7e3f5; border-radius: 18px; background: #f8fbff; padding: 20px; }
.__TOOL_CLASS__ .tool-shell, .__TOOL_CLASS__ .tool-inspector-section, .__TOOL_CLASS__ .tool-result-section-card { border: 1px solid #dbeafe; border-radius: 16px; background: #fff; }
.__TOOL_CLASS__ .tool-shell { padding: 18px; box-shadow: 0 18px 45px rgba(15, 23, 42, 0.08); }
.__TOOL_CLASS__ .form-control, .__TOOL_CLASS__ .form-select { width: 100%; border: 1px solid #cbd5e1; border-radius: 10px; background: #fff; padding: 10px 12px; color: #111827; font: 700 14px/1.4 var(--default-font); }
.__TOOL_CLASS__ .btn, .__TOOL_CLASS__ button { font: 800 13px/1.2 var(--default-font); }
.__TOOL_CLASS__ .d-none, .__TOOL_CLASS__ [hidden] { display: none !important; }
.__TOOL_CLASS__ table { width: 100%; border-collapse: collapse; }
.__TOOL_CLASS__ th, .__TOOL_CLASS__ td { border-bottom: 1px solid #e2e8f0; padding: 10px; text-align: left; vertical-align: top; }
  </style>
  <link rel="stylesheet" href="section.css">
</head>
<body>
  <main class="demo-shell">
    <h1 class="demo-title">Assessment Scope Selectors Demo</h1>
    <div class="__TOOL_CLASS__">
      <div class="tool-box">
            <div class="__PREFIX__-basic-panel">
              <div class="__PREFIX__-inner-panel">
                <div class="__PREFIX__-setting-row">
                  <label for="__DOM_PREFIX__Family" class="__PREFIX__-setting-label">
                    Top-level section:
                    <span class="info-dot" title="Narrow the benchmark to one family such as initial, firewall, or access control">i</span>
                  </label>

                  <div class="__PREFIX__-setting-field">
                    <div class="__PREFIX__-select-tools">
                      <button type="button" class="__PREFIX__-select-mini-btn" id="__DOM_PREFIX__FamilyReset">All sections</button>
                    </div>

                    <details class="__PREFIX__-select" id="__DOM_PREFIX__FamilySelect">
                      <summary class="__PREFIX__-select-summary">
                        <span id="__DOM_PREFIX__FamilySummary">All sections</span>
                      </summary>

                      <div class="__PREFIX__-select-body">
                        <div class="__PREFIX__-select-grid" id="__DOM_PREFIX__FamilyOptions"></div>
                      </div>
                    </details>

                    <input type="hidden" id="__DOM_PREFIX__Family" value="all">
                  </div>
                </div>

                <div class="__PREFIX__-setting-row">
                  <label for="__DOM_PREFIX__SectionPath" class="__PREFIX__-setting-label">
                    Section path:
                    <span class="info-dot" title="Choose a benchmark path or keep the whole current family in scope">i</span>
                  </label>

                  <div class="__PREFIX__-setting-field">
                    <div class="__PREFIX__-select-tools">
                      <button type="button" class="__PREFIX__-select-mini-btn" id="__DOM_PREFIX__SectionReset">All paths</button>
                    </div>

                    <details class="__PREFIX__-select" id="__DOM_PREFIX__SectionSelect">
                      <summary class="__PREFIX__-select-summary">
                        <span id="__DOM_PREFIX__SectionSummary">All paths</span>
                      </summary>

                      <div class="__PREFIX__-select-body __PREFIX__-select-body-scroll">
                        <div class="__PREFIX__-select-grid" id="__DOM_PREFIX__SectionOptions"></div>
                      </div>
                    </details>

                    <input type="hidden" id="__DOM_PREFIX__SectionPath" value="all">
                  </div>
                </div>

                <div class="__PREFIX__-setting-row">
                  <label for="__DOM_PREFIX__Criticality" class="__PREFIX__-setting-label">
                    Criticality:
                    <span class="info-dot" title="Filter controls by declared benchmark criticality or missing metadata">i</span>
                  </label>

                  <div class="__PREFIX__-setting-field">
                    <details class="__PREFIX__-select" id="__DOM_PREFIX__CriticalitySelect">
                      <summary class="__PREFIX__-select-summary">
                        <span id="__DOM_PREFIX__CriticalitySummary">All criticality</span>
                      </summary>

                      <div class="__PREFIX__-select-body">
                        <div class="__PREFIX__-select-grid" id="__DOM_PREFIX__CriticalityOptions"></div>
                      </div>
                    </details>

                    <input type="hidden" id="__DOM_PREFIX__Criticality" value="all">
                  </div>
                </div>

                <div class="__PREFIX__-setting-row">
                  <label for="__DOM_PREFIX__SelectedControl" class="__PREFIX__-setting-label">
                    Script source:
                    <span class="info-dot" title="Pick the exact CIS control script to inspect and copy">i</span>
                  </label>

                  <div class="__PREFIX__-setting-field">
                    <div class="__PREFIX__-select-tools">
                      <button type="button" class="__PREFIX__-select-mini-btn" id="__DOM_PREFIX__ControlReset">First match</button>
                    </div>

                    <details class="__PREFIX__-select" id="__DOM_PREFIX__ControlSelect">
                      <summary class="__PREFIX__-select-summary">
                        <span id="__DOM_PREFIX__ControlSummary">First matched script</span>
                      </summary>

                      <div class="__PREFIX__-select-body __PREFIX__-select-body-scroll">
                        <div class="__PREFIX__-select-grid" id="__DOM_PREFIX__ControlOptions"></div>
                      </div>
                    </details>

                    <input type="hidden" id="__DOM_PREFIX__SelectedControl" value="">
                  </div>
                </div>

                <div class="__PREFIX__-setting-row">
                  <label class="__PREFIX__-setting-label">
                    Criticality map:
                    <span class="info-dot" title="This reflects the metadata declared in the copied benchmark scripts under assets/bin">i</span>
                  </label>

                  <div class="__PREFIX__-setting-field">
                    <div class="__PREFIX__-criticality-row" id="__DOM_PREFIX__CriticalityRow"></div>
                  </div>
                </div>
              </div>
            </div>

            <details class="__PREFIX__-advanced">
              <summary class="__PREFIX__-advanced-summary">
                <span>Advanced</span>
              </summary>

              <div class="__PREFIX__-advanced-body">
                <div class="__PREFIX__-inner-panel">
                  <div class="__PREFIX__-setting-row">
                    <label for="__DOM_PREFIX__RowLimit" class="__PREFIX__-setting-label">
                      Visible rows:
                      <span class="info-dot" title="Limit the controls table while keeping the selected script available">i</span>
                    </label>

                    <div class="__PREFIX__-setting-field">
                      <details class="__PREFIX__-select" id="__DOM_PREFIX__RowLimitSelect">
                        <summary class="__PREFIX__-select-summary">
                          <span id="__DOM_PREFIX__RowLimitSummary">50 rows</span>
                        </summary>

                        <div class="__PREFIX__-select-body">
                          <div class="__PREFIX__-select-grid __PREFIX__-select-grid-two" id="__DOM_PREFIX__RowLimitOptions"></div>
                        </div>
                      </details>

                      <input type="hidden" id="__DOM_PREFIX__RowLimit" value="50">
                    </div>
                  </div>
                </div>
              </div>
            </details>
      </div>
    </div>
  </main>
  <script src="section.js"></script>
  <script>
    if (window.InfraStackAssessmentWorkspaceSections && typeof window.InfraStackAssessmentWorkspaceSections.scopeSelectors === 'function') {
      window.InfraStackAssessmentWorkspaceSections.scopeSelectors(document);
    }
  </script>
</body>
</html>
